# Buf code-generation config.
# Generates Rust types via prost + tonic (gRPC service stubs) into rust/warrantor-api/src/generated/.
# Run `buf generate` from the repo root. CI rejects uncommitted generated code.
version: v2
managed:
  enabled: true
  override:
    - file_option: java_package
      value: com.muveraai.api
plugins:
  - remote: buf.build/community/neoeinstein-prost
    out: rust/warrantor-api/src/generated
    opt:
      - compile_well_known_types=false
      - disable_comments=false
inputs:
  - directory: proto
