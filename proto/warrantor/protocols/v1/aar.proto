// P2 — Agent Action Receipt (AAR). Tamper-evident receipt per material agent action.
// See specs/protocols/P2-aar.md. Emitted by E1 flight-recorder BEFORE the action commits
// (invariant I-07: evidence precedes commitment).
syntax = "proto3";

package warrantor.protocols.v1;

import "google/protobuf/timestamp.proto";

// An Agent Action Receipt.
message AgentActionReceipt {
  // Unique receipt ID (UUID).
  string id = 1;
  // The SPIFFE SVID of the acting agent.
  string actor = 2;
  // SHA-256 hash of the AAE (P1) that authorized the action.
  bytes authority_hash = 3;
  // The exact artifact versions in play (model digest, tool versions, skill versions).
  map<string, string> artifact_versions = 4;
  // SHA-256 commitment to the context provenance envelope (P3) at action time.
  bytes context_commitment = 5;
  // The policy decision that permitted the action.
  PolicyDecision policy_decision = 6;
  // The tool or API operation performed.
  string tool_or_api_op = 7;
  // Deterministic check results (constant-time-safe assertions).
  repeated DeterministicCheck deterministic_checks = 8;
  // Approver SPIFFE IDs (for consequential actions; invariant I-08).
  repeated string approvers = 9;
  // The action outcome.
  ActionOutcome outcome = 10;
  // Pointer to a rollback record, if the action was rolled back.
  string rollback_pointer = 11;
  // When the receipt was emitted (pre-commit).
  google.protobuf.Timestamp emitted_at = 12;
  // Trust-core signature over the canonical-CBOR encoding.
  bytes signature = 13;
}

message PolicyDecision {
  // The policy engine that decided (e.g. "opa", "cedar", "openshell").
  string engine = 1;
  // The decision: "allow" or "deny".
  string decision = 2;
  // The policy bundle hash that was evaluated.
  bytes policy_hash = 3;
  // The evaluated Rego/Cedar rule IDs.
  repeated string matched_rules = 4;
}

message DeterministicCheck {
  string name = 1;
  bool passed = 2;
  string detail = 3;
}

enum ActionOutcome {
  ACTION_OUTCOME_UNSPECIFIED = 0;
  ACTION_OUTCOME_PENDING = 1;        // pre-commit (invariant I-07)
  ACTION_OUTCOME_COMMITTED = 2;      // effect visible
  ACTION_OUTCOME_ROLLED_BACK = 3;    // undone
  ACTION_OUTCOME_FAILED = 4;         // did not take effect
}
