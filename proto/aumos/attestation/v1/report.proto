// AumOS attestation contracts — GPU/runtime attestation reports consumed by C1-1 nvtrust-bridge,
// C1-2 cuda-gram, and the composite attestation layer (P12 CAP, plane 9).
syntax = "proto3";

package aumos.attestation.v1;

import "google/protobuf/timestamp.proto";

// A GPU attestation report, mirroring the Rust `AttestationReport` in C1-1.
message GpuAttestationReport {
  // GPU model (e.g. "H100", "H200", "mock-H100").
  string gpu_model = 1;
  // Opaque attestation bytes from the GPU (NVTrust-defined format).
  bytes attestation_bytes = 2;
  // 16-byte nonce used to prevent replay.
  bytes nonce = 3;
  // When the report was generated.
  google.protobuf.Timestamp generated_at = 4;
}

// A composite attestation (plane 9) — chains hardware → runtime → agent identity.
message CompositeAttestation {
  // The GPU attestation (from C1-1/C1-2).
  GpuAttestationReport gpu = 1;
  // The runtime attestation digest (from R2 eval-guard SandboxAttestation).
  bytes runtime_attestation_digest = 2;
  // The agent identity SVID (from I1).
  string agent_svid = 3;
  // When the composite attestation was assembled.
  google.protobuf.Timestamp assembled_at = 4;
  // Trust-core signature over the canonical-CBOR encoding of the above.
  bytes signature = 5;
}

// A sandbox attestation (R2 eval-guard) — emitted when all 4 pre-flight checks pass.
message SandboxAttestation {
  // The checks that passed.
  repeated BoundaryCheck passed_checks = 1;
  // 16-byte nonce.
  bytes nonce = 2;
  // When the attestation was emitted.
  google.protobuf.Timestamp emitted_at = 3;
  // Trust-core signature.
  bytes signature = 4;
}

// The four pre-flight boundary checks R2 eval-guard runs.
enum BoundaryCheck {
  BOUNDARY_CHECK_UNSPECIFIED = 0;
  BOUNDARY_CHECK_NETWORK_ISOLATION = 1;
  BOUNDARY_CHECK_FILESYSTEM_BOUNDARY = 2;
  BOUNDARY_CHECK_PROCESS_ISOLATION = 3;
  BOUNDARY_CHECK_EGRESS_ATTESTATION = 4;
}
