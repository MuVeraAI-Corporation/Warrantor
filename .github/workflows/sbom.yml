# SBOM — CycloneDX generation per component (cross-cutting 08-sbom-strategy).
# Produces one CycloneDX JSON per Rust crate and one for the Python package.
# Uploads the SBOMs as artifacts; in Wave-2 they get attached to GitHub releases.
name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-sbom:
    name: Rust CycloneDX SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked || echo "cargo-cyclonedx cached"
      - name: Generate CycloneDX SBOMs
        # One SBOM per workspace member, written to rust/<dir>/<crate-name>.cdx.json.
        # `--all` here means "all dependencies, not just top-level" -- it is not a
        # crate selector; workspace members are each emitted regardless. There is no
        # --output-pattern flag in cargo-cyclonedx, and passing one is a hard error,
        # which is what kept this job red.
        run: cargo cyclonedx --all --format json
      - name: Aggregate SBOMs
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p sbom
          # Match the name the tool actually writes (<crate-name>.cdx.json). The
          # previous pattern looked for bom.json, matched nothing, and would have
          # uploaded an empty artifact behind a green check.
          found=0
          while IFS= read -r -d '' f; do
            cp "$f" "sbom/$(basename "$f")"
            found=$((found + 1))
          done < <(find rust -maxdepth 2 -name '*.cdx.json' -print0)
          # An empty SBOM set fails loudly. A provenance artifact that silently
          # contains nothing is worse than one that is plainly missing.
          if [ "$found" -eq 0 ]; then
            echo "::error::No CycloneDX SBOMs were generated -- refusing to upload an empty artifact."
            exit 1
          fi
          echo "Aggregated $found crate SBOMs."
          ls -la sbom/
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sboms
          path: sbom/

  python-sbom:
    name: Python CycloneDX SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/cuda_gram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cyclonedx-bom
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom
          pip install -e .
      - name: Generate SBOM from environment
        run: cyclonedx-py environment -o aumos-python-cuda-gram.bom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: python-cyclonedx-sbom
          path: python/cuda_gram/aumos-python-cuda-gram.bom.json
