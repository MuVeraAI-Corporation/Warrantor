# SBOM — CycloneDX generation per component (cross-cutting 08-sbom-strategy).
# Produces one CycloneDX JSON per Rust crate and one for the Python package.
# Uploads the SBOMs as artifacts; in Wave-2 they get attached to GitHub releases.
name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-sbom:
    name: Rust CycloneDX SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked || echo "cargo-cyclonedx cached"
      - name: Generate CycloneDX SBOMs
        # Generates one bom.json per crate under rust/<crate>/.
        run: cargo cyclonedx --all --format json --output-pattern package
      - name: Aggregate SBOMs
        working-directory: .
        run: |
          mkdir -p sbom
          # Collect every generated bom.json into sbom/<crate>-bom.json
          find rust -maxdepth 2 -name 'bom.json' -print0 | while IFS= read -r -d '' f; do
            crate_dir=$(dirname "$f")
            crate=$(basename "$crate_dir")
            cp "$f" "sbom/${crate}.bom.json"
          done
          ls -la sbom/
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sboms
          path: sbom/

  python-sbom:
    name: Python CycloneDX SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/cuda_gram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cyclonedx-bom
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom
          pip install -e .
      - name: Generate SBOM from environment
        run: cyclonedx-py environment -o aumos-python-cuda-gram.bom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: python-cyclonedx-sbom
          path: python/cuda_gram/aumos-python-cuda-gram.bom.json
