# SLSA L3 build provenance — generates GitHub build attestations for every release artifact.
# Uses GitHub's native artifact attestations (the SLSA L3-compliant provenance format).
# Cross-reference: docs/cross-cutting/13-compliance-frameworks.md (SLSA L3 target).
#
# This workflow runs on release-tag pushes (v*). It builds each Rust binary, attaches a
# SLSA L3 provenance attestation via `gh attestation`, and produces the artifact bundle.
name: Provenance (SLSA L3)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write  # required for sigstore signing of attestations

jobs:
  build-and-attest:
    name: Build + SLSA L3 attestation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build release binaries
        run: cargo build --release --bins
      - name: Stage binaries
        run: |
          mkdir -p ../dist
          for bin in trust-core defstack nvtrust-verify eval-guard kill-switch credential-vault; do
            cp target/release/$bin ../dist/ || echo "  (skipped $bin — not present)"
          done
          ls -la ../dist/
      - name: Generate artifact attestations (SLSA L3)
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/
