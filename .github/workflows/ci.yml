# Warrantor strict CI: every language, every module, every contract lane.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify every commit carries a Signed-off-by trailer
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <[^>]+@[^>]+>[[:space:]]*$'; then
              echo "ok   $(git show -s --format='%h %s' "$sha")"
            else
              echo "::error::Commit $sha is missing a 'Signed-off-by:' trailer (see CONTRIBUTING — commit with 'git commit -s')"
              git show -s --format='FAIL %h %s' "$sha"
              missing=1
            fi
          done
          test "$missing" -eq 0

  contract-plane:
    name: Contract plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # bufbuild/buf-setup-action declares `using: node20` at EVERY published version,
      # including its latest (v1.50.0) -- verified against the action.yml at both `v1` and
      # the pinned tag. So no version bump clears the Node 20 deprecation here; the only
      # fix available to this repository is to stop using the action.
      #
      # It only ever installed a CLI. Doing that directly costs four lines and buys two
      # things the floating `@v1` did not: the version is PINNED rather than whatever v1.x
      # resolves to today, and the download is VERIFIED against the checksum buf publishes.
      # An unverified binary fetched into a job that lints the contract plane is a supply
      # chain nobody chose.
      - name: Install buf
        env:
          BUF_VERSION: 1.72.0
          # From https://github.com/bufbuild/buf/releases/download/v1.72.0/sha256.txt
          BUF_SHA256: 8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/buf \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          # Fails the job on mismatch rather than warning: a wrong binary here lints nothing
          # and reports success, which is the failure mode this gate exists to prevent.
          echo "${BUF_SHA256}  /tmp/buf" | sha256sum -c -
          install -m 0755 /tmp/buf /usr/local/bin/buf
          buf --version
      - name: Lint protobuf contracts
        run: buf lint
      # Compare against the LOCAL clone, not a fresh HTTPS clone of the remote.
      # The remote form cannot authenticate against a private repository -- it
      # fails with "could not read Username for 'https://github.com'" before it
      # compares a single proto, so the gate silently stops gating.
      # Fetch into a REMOTE-TRACKING ref, not a local branch. On a push-to-main
      # run, main is the checked-out branch and git refuses to fetch into it:
      #   fatal: refusing to fetch into branch 'refs/heads/main' checked out at ...
      # refs/remotes/ never collides with the working tree, so one form works for
      # both pull_request and push events.
      - name: Fetch main for the breaking-change comparison
        run: git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
      - name: Reject breaking changes from main
        run: buf breaking --against '.git#ref=origin/main'

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # warrantor-api's build.rs runs tonic-build, which shells out to protoc.
      # Without this the whole workspace fails to build, not just that crate.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Nothing else in this job passes --locked, so cargo quietly rewrites Cargo.lock in the
      # runner whenever the committed one does not match the manifests, and every step after it
      # passes. That is how #11 and #47 -- two green PRs, each editing Cargo.lock, merged one
      # after the other -- put a lock on main that resolved wasm-tools 0.132 under a wasmtime
      # that requires 0.134. Git merged both diffs textually because they touched different
      # lines; neither PR was wrong and no check was looking.
      #
      # It matters beyond tidiness: sbom.yml reads this lock, so a stale one publishes a
      # dependency set nobody builds, under a supply-chain claim this repository does make.
      # `--locked` here fails the build instead, and the fix is one `cargo metadata` and a commit.
      - name: Verify Cargo.lock matches the manifests
        run: cargo metadata --format-version 1 --locked > /dev/null
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy with warnings denied
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Build all targets
        run: cargo build --workspace --all-targets

  python:
    name: Python (35 projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/*/pyproject.toml
      - name: Install required test tooling
        run: python -m pip install --disable-pip-version-check pytest
      # The THIRD job to need this, and for the third distinct reason. warrantor_ml's
      # bounds-interop test shells out to the Rust `emit_bounds_vectors` binary to
      # produce its fixture, and warrantor-api's build.rs runs tonic-build, which
      # needs protoc. Without it the fixture cannot be produced and the test fails --
      # correctly and loudly, because a cross-language check that SKIPS when its
      # fixture is absent reports success having never run.
      #
      # ci.yml's rust and conformance jobs already carry this; coverage.yml learned it
      # separately. Each workflow job is its own environment and a fix in one does not
      # propagate, which is exactly how the first two went unnoticed.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Install each project from its own pyproject.toml rather than maintaining a
      # package list here. The previous hardcoded list omitted jsonschema and
      # pyyaml, which both projects declare correctly -- the list was the defect.
      - name: Install every project and its declared dependencies
        run: python tools/ci/run_python_checks.py install
      # Pin the linter AFTER the project installs, which declare `ruff>=0.4` and
      # would otherwise float it to latest. A lint gate whose ruleset changes
      # without a commit is not a gate -- it fails builds that were green
      # yesterday, for code nobody touched. Bump this deliberately.
      - name: Pin the lint toolchain
        run: python -m pip install --disable-pip-version-check "ruff==0.12.0"
      - name: Test every project
        run: python tools/ci/run_python_checks.py test --report evidence/python-tests.json
      - name: Lint every project
        run: python tools/ci/run_python_checks.py lint --report evidence/python-lint.json
      - name: Check formatting for every project
        run: python tools/ci/run_python_checks.py format --report evidence/python-format.json
      - name: Upload Python evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-gate-evidence
          path: evidence/python-*.json
          if-no-files-found: error

  go:
    name: Go (12 modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false
      - name: Test every module
        run: python tools/ci/run_go_checks.py test --report evidence/go-tests.json
      - name: Vet every module
        run: python tools/ci/run_go_checks.py vet --report evidence/go-vet.json
      - name: Check formatting
        run: test -z "$(gofmt -l $(find go -type f -name '*.go'))"
      - name: Upload Go evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-gate-evidence
          path: evidence/go-*.json
          if-no-files-found: error

  typescript:
    name: TypeScript (5 workspaces)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Typecheck conformance verifier
        run: npm run typecheck:conformance
      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate

  conformance:
    name: Cross-language conformance (220 checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      # The Rust verifier is built from the workspace, so this job needs protoc too.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # The Python verifier imports protocol_contracts, which needs jsonschema.
      # Installing the project pulls its declared dependencies; a bare `cryptography`
      # left the verifier unavailable and cost 84 of 220 checks.
      - name: Install Python verifier dependencies
        run: |
          python -m pip install --disable-pip-version-check cryptography
          python -m pip install --disable-pip-version-check -e python/protocol_contracts
      - name: Run required vector matrix
        run: python tools/conformance/run.py --report evidence/conformance.json
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-evidence
          path: evidence/conformance.json
          if-no-files-found: error

  docs:
    name: Documentation and tracker contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run documentation checks
        run: python tools/ci/check_docs.py
      - name: Generate exhaustive implementation tracker
        run: python tools/implementation/generate_tracker.py --output evidence/implementation-tracker.json
      - name: Upload implementation inventory
        uses: actions/upload-artifact@v7
        with:
          name: implementation-tracker
          path: evidence/implementation-tracker.json
          if-no-files-found: error

  desktop:
    name: Desktop shell policy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      # No `npm ci`, and no Electron. The shell's security decisions -- which origin the window may
      # navigate to, which permissions are granted, which line carries the token, and which binary
      # becomes the agent -- live in `src/policy.js`, which imports nothing. So this gate needs no
      # dependency install, no ~150 MB Chromium download and no display, and it still covers the
      # code where a mistake would matter. Everything Electron-specific is wiring around those
      # functions, and the packaging tests read the builder config and the lockfile as data.
      #
      # `npm audit` reads package-lock.json and queries the registry: no node_modules, no Chromium,
      # so the job keeps that property. It is here because RFC W1 calls a clean audit a release
      # gate, and a checklist item nobody runs is not a gate -- this directory ships a browser
      # engine, and Electron 33 carried 21 high-severity advisories. It also errors when the
      # lockfile has drifted from package.json, which is the only cheap check that the lockfile is
      # coherent before the release workflow tries to `npm ci` it at tag time.
      #
      # `continue-on-error`, and only here. This step is a live query against the npm advisory
      # service covering electron-builder's whole build-tool tree, so it can turn red with no change
      # to this repository at all -- a newly published moderate advisory, or a registry outage. As a
      # blocking member of the `required` gate that would stop every unrelated Rust and Python pull
      # request, and none of the remedies (a newer electron-builder, a scoped `overrides` entry,
      # holding the release) is something an unrelated contributor can apply. The gate that matters
      # keeps its teeth: the copy in `.github/workflows/desktop-release.yml` is hard-failing, so a
      # release still cannot ship on a vulnerable pin.
      #
      # This is not a silenced guard. The step still runs on every pull request and still reports
      # red in the checks list when an advisory lands, which is the signal it exists to raise; what
      # is removed is only its power to block merges elsewhere in the repository. The deterministic
      # half of the property -- that the lockfile still resolves Electron inside the audited range
      # -- is asserted offline by `desktop/test/packaging.test.js` in the hard-failing step below.
      - name: Audit the pinned Electron and its build tooling
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Run policy and packaging tests
        run: node --test

  console:
    name: Browser console behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      # Same trade as the desktop job above, for the same reason. The Rust tests over
      # `rust/warrant/tests/console.rs` can only assert on the bytes the server sends; which empty
      # state a reader is shown -- "no warrants yet" versus "no warrants in this state" versus "this
      # list could not be read" -- is decided in `console.js`, and three of those four rungs were
      # wrong or unreachable while every Rust test passed. `node --test` is the runtime's own
      # runner: no install, no bundler, no framework, no package manager, so RFC W1 §Dependencies
      # holds. The DOM is stubbed in the test file itself.
      - name: Run console tests
        run: node --test rust/warrant/src/console/console.test.js

  invariants:
    name: Invariant attack corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Same reason as the rust job: warrantor-api's build.rs shells out to protoc, and
      # warrantor-warrant reaches it transitively through authority-spec.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # A separate job from `rust`, deliberately. The corpus is a published number rather than
      # another test file: it needs a ratchet that the ordinary test step has no way to express,
      # and it should stay legible as its own red or green in the checks list. Its tests also run
      # inside the rust job's `cargo test --workspace`, so this job adds the gate, not the coverage.
      #
      # The script runs the corpus itself rather than parsing a piped log, so a run that never
      # happened fails here instead of reading as a run in which nothing failed.
      #
      # `--show-findings` prints the ignored tests failing. They are the recorded invariant
      # violations and they are meant to be visible in a green build: a finding nobody is shown is
      # how a gap becomes permanent.
      - name: Enforce the invariant ratchet
        run: python tools/ci/check_invariant_ratchet.py --show-findings

  required:
    name: Required checks
    if: always()
    needs:
      [
        dco,
        contract-plane,
        rust,
        python,
        go,
        typescript,
        conformance,
        docs,
        desktop,
        console,
        invariants,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all required jobs
        env:
          DCO: ${{ needs.dco.result }}
          CONTRACT_PLANE: ${{ needs.contract-plane.result }}
          RUST: ${{ needs.rust.result }}
          PYTHON: ${{ needs.python.result }}
          GO: ${{ needs.go.result }}
          TYPESCRIPT: ${{ needs.typescript.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
          DOCS: ${{ needs.docs.result }}
          DESKTOP: ${{ needs.desktop.result }}
          CONSOLE: ${{ needs.console.result }}
          INVARIANTS: ${{ needs.invariants.result }}
        run: |
          for result in "$DCO" "$CONTRACT_PLANE" "$RUST" "$PYTHON" "$GO" "$TYPESCRIPT" "$CONFORMANCE" "$DOCS" "$DESKTOP" "$CONSOLE" "$INVARIANTS"; do
            test "$result" = "success"
          done
