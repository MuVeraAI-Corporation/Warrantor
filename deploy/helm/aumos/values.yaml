# AumOS Helm Chart — Default values
# Override per-deployment via values.yaml or --set

# ─── Global ──────────────────────────────────────────────────────────────────
global:
  trustDomain: warrantor.dev
  imageRegistry: ""  # Set to your registry (e.g. ghcr.io/muverai)
  imagePullPolicy: IfNotPresent
  logLevel: info
  # mTLS via SPIFFE — set to true in production
  mtls:
    enabled: false
    spireServer: spire-server.spire.svc.cluster.local

# ─── Trust Core (Rust) ──────────────────────────────────────────────────────
trustCore:
  enabled: true
  image: warrantor-trust-core:1.0.0
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ─── Agent Identity (Go) ────────────────────────────────────────────────────
agentIdentity:
  enabled: true
  image: warrantor-agent-identity:1.0.0
  replicas: 3
  service:
    port: 8441
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

# ─── Open Serve Kit (Go) ────────────────────────────────────────────────────
openServeKit:
  enabled: true
  image: warrantor-open-serve-kit:1.0.0
  replicas: 2
  service:
    port: 8443
  backend: mock  # or vllm, triton, ollama
  backendUrl: ""
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

# ─── Inference Proxy (Rust) ─────────────────────────────────────────────────
inferenceProxy:
  enabled: true
  image: warrantor-inference-proxy:1.0.0
  replicas: 2
  service:
    port: 8444
  resources:
    requests: { cpu: 200m, memory: 128Mi }
    limits: { cpu: 1000m, memory: 512Mi }

# ─── Flight Recorder (Rust) ─────────────────────────────────────────────────
flightRecorder:
  enabled: true
  image: warrantor-flight-recorder:1.0.0
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ─── Kill Switch (Rust) ─────────────────────────────────────────────────────
killSwitch:
  enabled: true
  image: warrantor-kill-switch:1.0.0
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

# ─── Credential Vault (Rust) ────────────────────────────────────────────────
credentialVault:
  enabled: true
  image: warrantor-credential-vault:1.0.0
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ─── Tee Serve (Go) ─────────────────────────────────────────────────────────
teeServe:
  enabled: false  # Enable when confidential computing is available
  image: warrantor-tee-serve:1.0.0

# ─── Tenant Guard (Go) ──────────────────────────────────────────────────────
tenantGuard:
  enabled: true
  image: warrantor-tenant-guard:1.0.0
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

# ─── Fleet Marshal (Go) ─────────────────────────────────────────────────────
fleetMarshal:
  enabled: true
  image: warrantor-fleet-marshal:1.0.0
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }

# ─── Edge Sentinel (Go) ─────────────────────────────────────────────────────
edgeSentinel:
  enabled: false  # Deploy on edge nodes, not in cluster
  image: warrantor-edge-sentinel:1.0.0

# ─── Console (TypeScript) ───────────────────────────────────────────────────
console:
  enabled: true
  image: warrantor-console:1.0.0
  replicas: 2
  service:
    port: 3000
    type: ClusterIP  # Use LoadBalancer for external access
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ─── Persistence ────────────────────────────────────────────────────────────
persistence:
  enabled: false  # Enable for production
  storageClass: ""
  size: 10Gi

# ─── Pod Disruption Budget ──────────────────────────────────────────────────
pdb:
  enabled: true
  minAvailable: 2

# ─── Horizontal Pod Autoscaler ──────────────────────────────────────────────
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# ─── Topology Spread ────────────────────────────────────────────────────────
topologySpread:
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
