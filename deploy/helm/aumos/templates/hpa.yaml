{{- if .Values.hpa.enabled }}
{{- range $name, $svc := list
  "agent-identity" .Values.agentIdentity
  "open-serve-kit" .Values.openServeKit
  "inference-proxy" .Values.inferenceProxy
}}
{{- if $svc.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $.Values.hpa.minReplicas }}
  maxReplicas: {{ $.Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- end }}
