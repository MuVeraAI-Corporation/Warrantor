{{- /*
  Iterate name -> service-values pairs. This MUST be `dict`, not `list`:
  `range $k, $v` over a slice binds (index, element), which would make $name an
  integer and $svc a bare string. Over a map it binds (key, value) as intended,
  and Go templates walk map keys in sorted order, so output is deterministic.
*/ -}}
{{- range $name, $svc := dict
  "trust-core" .Values.trustCore
  "agent-identity" .Values.agentIdentity
  "open-serve-kit" .Values.openServeKit
  "inference-proxy" .Values.inferenceProxy
  "flight-recorder" .Values.flightRecorder
  "kill-switch" .Values.killSwitch
  "credential-vault" .Values.credentialVault
  "tenant-guard" .Values.tenantGuard
  "fleet-marshal" .Values.fleetMarshal
  "console" .Values.console
-}}
{{- if $svc.enabled }}
{{- $port := int (dig "port" 8080 (default (dict) $svc.service)) }}
{{- /*
  agent-identity signs every SVID with an Ed25519 key. If each replica generates its own, tokens
  issued by one pod fail verification at the other two -- roughly 2/3 of verifies fail, and
  revocation never propagates past the pod that recorded it. Fail rendering rather than ship that.
*/ -}}
{{- $signingKey := dict }}
{{- if eq $name "agent-identity" }}
  {{- $signingKey = default (dict) $svc.signingKey }}
  {{- $replicas := int ($svc.replicas | default 2) }}
  {{- if and (gt $replicas 1) (not $signingKey.secretName) }}
    {{- fail (printf "agentIdentity.replicas is %d but agentIdentity.signingKey.secretName is unset. Replicas must share one signing key or they will reject each other's tokens. Create the secret (see values.yaml) and set signingKey.secretName, or set agentIdentity.replicas=1." $replicas) }}
  {{- end }}
  {{- if and (not $signingKey.secretName) (not $signingKey.allowEphemeral) }}
    {{- fail "agentIdentity.signingKey.secretName is unset. Set it, or set agentIdentity.signingKey.allowEphemeral=true for a single-replica development install." }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: aumos
spec:
  replicas: {{ $svc.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: aumos
    spec:
      {{- if $.Values.global.mtls.enabled }}
      # SPIFFE workload identity via SPIRE agent
      initContainers:
        - name: spire-init
          image: ghcr.io/spiffe/spire-agent:latest
          command: ["/opt/spire/bin/spire-agent", "api", "fetch", "-socketPath", "/spire/agent.sock"]
      {{- end }}
      containers:
        - name: {{ $name }}
          {{- /* imageRegistry defaults to "" — do not emit a leading "/". */}}
          image: {{ with $.Values.global.imageRegistry }}{{ . }}/{{ end }}{{ $svc.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          env:
            - name: RUST_LOG
              value: {{ $.Values.global.logLevel | quote }}
            - name: AUMOS_TRUST_DOMAIN
              value: {{ $.Values.global.trustDomain | quote }}
          {{- if eq $name "agent-identity" }}
            {{- if $signingKey.secretName }}
            # Mounted as a file rather than an inline env value so the key never appears in the
            # pod spec, in `kubectl describe`, or in the process environment.
            - name: AUMOS_IDENTITY_SIGNING_KEY_FILE
              value: /etc/aumos/identity/{{ $signingKey.secretKey | default "seed" }}
            {{- else }}
            - name: AUMOS_IDENTITY_ALLOW_EPHEMERAL_KEY
              value: "true"
            {{- end }}
          {{- end }}
          {{- if and (eq $name "agent-identity") $signingKey.secretName }}
          volumeMounts:
            - name: identity-signing-key
              mountPath: /etc/aumos/identity
              readOnly: true
          {{- end }}
          {{- if $svc.service }}
          ports:
            - containerPort: {{ $port }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      {{- if and (eq $name "agent-identity") $signingKey.secretName }}
      volumes:
        - name: identity-signing-key
          secret:
            secretName: {{ $signingKey.secretName | quote }}
            defaultMode: 0400
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: {{ $.Values.topologySpread.maxSkew }}
          topologyKey: {{ $.Values.topologySpread.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- end }}
