<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img"><rect width="1600" height="1120" fill="#FDFDFC"/><text x="64" y="72" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#6B7280" font-weight="600" letter-spacing="2.2">CONCENTRATION OF CONSEQUENCE · METR / REDWOOD RESEARCH APPENDIX</text><line x1="64" y1="94" x2="1536" y2="94" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><text x="64" y="144.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#14161C" font-weight="700">Seventy thousand messages. A few dozen did the work.</text><text x="64" y="214" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#3D4451" font-weight="400">METR weighted every read by how much it changed the reading agent&#x27;s behavior, squared, across 61,966 read-bearing messages.</text><rect x="64" y="264" width="472.0" height="210" fill="#FFFFFF" rx="8" stroke="#A3353B" stroke-width="2.5"/><text x="88" y="338" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="46" fill="#A3353B" font-weight="700">47</text><text x="88" y="372" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="24" fill="#14161C" font-weight="700">0.076%</text><text x="88" y="406" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">of messages carry</text><text x="88" y="434.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="600">10% of the weighted traffic</text><rect x="564.0" y="264" width="472.0" height="210" fill="#FFFFFF" rx="8" stroke="#C77D3E" stroke-width="2.5"/><text x="588.0" y="338" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="46" fill="#C77D3E" font-weight="700">2,357</text><text x="588.0" y="372" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="24" fill="#14161C" font-weight="700">3.80%</text><text x="588.0" y="406" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">of messages carry</text><text x="588.0" y="434.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="600">50% of the weighted traffic</text><rect x="1064.0" y="264" width="472.0" height="210" fill="#FFFFFF" rx="8" stroke="#5B7C99" stroke-width="2.5"/><text x="1088.0" y="338" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="46" fill="#5B7C99" font-weight="700">28,168</text><text x="1088.0" y="372" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="24" fill="#14161C" font-weight="700">45.46%</text><text x="1088.0" y="406" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">of messages carry</text><text x="1088.0" y="434.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="600">90% of the weighted traffic</text><text x="64" y="510" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.5">CUMULATIVE SHARE OF WEIGHTED READ TRAFFIC</text><rect x="64" y="528" width="1076" height="250" fill="#F2F3F5" rx="6"/><line x1="64" y1="715.5" x2="1140" y2="715.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="butt"/><text x="72" y="709.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">25%</text><line x1="64" y1="653.0" x2="1140" y2="653.0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="butt"/><text x="72" y="647.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">50%</text><line x1="64" y1="590.5" x2="1140" y2="590.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="butt"/><text x="72" y="584.5" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">75%</text><path d="M 64 778 L 301 753 L 758 653 L 1048 553 L 1140 528" fill="none" stroke="#14161C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="300.9388563235329" y1="753.0" x2="300.9388563235329" y2="778" stroke="#A3353B" stroke-width="2" stroke-linecap="butt" stroke-dasharray="5 5"/><circle cx="300.9388563235329" cy="753.0" r="9" fill="#A3353B" stroke="#FFFFFF" stroke-width="2.5"/><text x="300.9388563235329" y="733.0" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#A3353B" font-weight="700" text-anchor="middle">47</text><line x1="757.9617874899219" y1="653.0" x2="757.9617874899219" y2="778" stroke="#C77D3E" stroke-width="2" stroke-linecap="butt" stroke-dasharray="5 5"/><circle cx="757.9617874899219" cy="653.0" r="9" fill="#C77D3E" stroke="#FFFFFF" stroke-width="2.5"/><text x="757.9617874899219" y="633.0" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#C77D3E" font-weight="700" text-anchor="middle">2,357</text><line x1="1047.902317043628" y1="553.0" x2="1047.902317043628" y2="778" stroke="#5B7C99" stroke-width="2" stroke-linecap="butt" stroke-dasharray="5 5"/><circle cx="1047.902317043628" cy="553.0" r="9" fill="#5B7C99" stroke="#FFFFFF" stroke-width="2.5"/><text x="1047.902317043628" y="533.0" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#5B7C99" font-weight="700" text-anchor="middle">28,168</text><text x="64" y="804" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">share of messages, log scale  ·  0.01%          1%          100%</text><text x="1180" y="510" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.5">WHAT THOSE 47 MESSAGES WERE ABOUT</text><text x="1180" y="550" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="600">Hacking Hugging Face</text><rect x="1180" y="558" width="250.0" height="20" fill="#A3353B" rx="3"/><text x="1442" y="574" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">16</text><text x="1180" y="602" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="600">Cross-cutting infrastructure</text><rect x="1180" y="610" width="250.0" height="20" fill="#3F7A5E" rx="3"/><text x="1442" y="626" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">16</text><text x="1180" y="654" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="600">Scorers and logs</text><rect x="1180" y="662" width="125.0" height="20" fill="#C77D3E" rx="3"/><text x="1442" y="678" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">8</text><text x="1180" y="706" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="600">Replacing the target</text><rect x="1180" y="714" width="78.125" height="20" fill="#5B7C99" rx="3"/><text x="1442" y="730" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">5</text><text x="1180" y="758" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="600">The intended solution</text><rect x="1180" y="766" width="31.25" height="20" fill="#8B8FA3" rx="3"/><text x="1442" y="782" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">2</text><rect x="64" y="850" width="1472" height="132" fill="#FFFFFF" rx="8" stroke="#A3353B" stroke-width="2.5"/><text x="88" y="886" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3353B" font-weight="700" letter-spacing="1.5">WHY THIS IS AN OPERATIONAL FINDING</text><text x="88" y="920.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">If a handful of artifacts carry most of the causal weight, sampling agent communications uniformly will return</text><text x="88" y="943.04" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">file chunks and heartbeats and tell you nothing is happening. What you need is a measure of consequence: which</text><text x="88" y="966.08" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">messages changed what the reading system did next.</text><text x="64" y="998" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">METR ran the importance classifier late in the investigation and states it did not inspect what surrounding context that classifier was given. The distribution is the finding; the exact figures are softer than they look.</text><line x1="64" y1="1046" x2="1536" y2="1046" stroke="#D8DCE3" stroke-width="1.5" stroke-linecap="butt"/><text x="64" y="1074" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">All figures from the METR / Redwood Research investigation appendix, 26 August 2026.</text><text x="1536" y="1074" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="end">vikramjha.work  ·  fig 11 · concentration</text></svg>