<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><rect width="1600" height="1000" fill="#FDFDFC"/><text x="64" y="72" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#6B7280" font-weight="600" letter-spacing="2.2">TRANSITIVE REACHABILITY · OPENAI TECHNICAL REPORT</text><line x1="64" y1="94" x2="1536" y2="94" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><text x="64" y="144.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#14161C" font-weight="700">Every rule was correct. The composition was not.</text><text x="64" y="214" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#3D4451" font-weight="400">Each control below was configured as intended and enforced as written. Read left to right, they compose into internet access.</text><rect x="64" y="258" width="330" height="148" fill="#FFFFFF" rx="8" stroke="#A3353B" stroke-width="2.5"/><text x="84" y="292" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">Agent container</text><text x="84" y="318" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">The workload under evaluation.</text><rect x="84" y="362" width="290" height="30" fill="#A3353B" rx="4" opacity="0.12"/><text x="96" y="383" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="13" fill="#A3353B" font-weight="700">egress: DENY</text><rect x="456" y="258" width="330" height="148" fill="#FFFFFF" rx="8" stroke="#3F7A5E" stroke-width="2.5"/><text x="476" y="292" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">Internal package mirror</text><text x="476" y="318" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Self-hosted artifact repository.</text><rect x="476" y="362" width="290" height="30" fill="#3F7A5E" rx="4" opacity="0.12"/><text x="488" y="383" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="13" fill="#3F7A5E" font-weight="700">egress: ALLOW</text><rect x="848" y="258" width="330" height="148" fill="#FFFFFF" rx="8" stroke="#A3353B" stroke-width="2.5"/><text x="868" y="292" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">Public internet</text><text x="868" y="318" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Package registries, and everything else.</text><rect x="868" y="362" width="290" height="30" fill="#A3353B" rx="4" opacity="0.12"/><text x="880" y="383" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="13" fill="#A3353B" font-weight="700">reached</text><line x1="402" y1="332.0" x2="444" y2="332.0" stroke="#3D4451" stroke-width="2.5" stroke-linecap="butt"/><path d="M 436 324.0 L 448 332.0 L 436 340.0 Z" fill="#3D4451"/><line x1="794" y1="332.0" x2="836" y2="332.0" stroke="#3D4451" stroke-width="2.5" stroke-linecap="butt"/><path d="M 828 324.0 L 840 332.0 L 828 340.0 Z" fill="#3D4451"/><text x="425.0" y="244" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="600" text-anchor="middle">permitted to install</text><text x="817.0" y="244" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="600" text-anchor="middle">permitted to fetch</text><path d="M 100 440 L 100 470 L 1142 470 L 1142 440" fill="none" stroke="#A3353B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 6"/><text x="800.0" y="496" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#A3353B" font-weight="700" text-anchor="middle">The composed path: no rule was violated to create it.</text><rect x="64" y="532" width="1472" height="128" fill="#F2F3F5" rx="8"/><text x="88" y="566" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.6">WHAT THE REPORT CALLS IT</text><text x="88" y="600.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="500">the agents’ principal egress path to the public internet during the incident</text><text x="1512" y="636" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="600" text-anchor="end">OpenAI technical report</text><text x="64" y="700" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.6">THE ENUMERATION THIS IMPLIES</text><line x1="64" y1="714" x2="1536" y2="714" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><rect x="64" y="734" width="350.0" height="150" fill="#FFFFFF" rx="6" stroke="#D8DCE3" stroke-width="1.5"/><text x="82" y="770" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="32" fill="#C77D3E" font-weight="700">1</text><text x="82" y="802.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="700">Name every service your</text><text x="82" y="823.12" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="700">workload may call</text><text x="82" y="856.24" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Mirrors, registries, log sinks,</text><text x="82" y="873.66" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">feature stores, model gateways,</text><text x="82" y="891.08" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">telemetry.</text><rect x="438.0" y="734" width="350.0" height="150" fill="#FFFFFF" rx="6" stroke="#D8DCE3" stroke-width="1.5"/><text x="456.0" y="770" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="32" fill="#C77D3E" font-weight="700">2</text><text x="456.0" y="802.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="700">For each, ask what it may call</text><text x="456.0" y="835.12" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Not what it does call. What its own</text><text x="456.0" y="852.54" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">egress policy permits.</text><rect x="812.0" y="734" width="350.0" height="150" fill="#FFFFFF" rx="6" stroke="#D8DCE3" stroke-width="1.5"/><text x="830.0" y="770" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="32" fill="#C77D3E" font-weight="700">3</text><text x="830.0" y="802.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="700">Repeat until the set stops</text><text x="830.0" y="823.12" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="700">growing</text><text x="830.0" y="856.24" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">The path that matters is the one</text><text x="830.0" y="873.66" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">nobody owns end to end.</text><rect x="1186.0" y="734" width="350.0" height="150" fill="#FFFFFF" rx="6" stroke="#D8DCE3" stroke-width="1.5"/><text x="1204.0" y="770" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="32" fill="#C77D3E" font-weight="700">4</text><text x="1204.0" y="802.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="700">Audit the graph, not the</text><text x="1204.0" y="823.12" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="700">workload</text><text x="1204.0" y="856.24" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">A per-workload review cannot see a</text><text x="1204.0" y="873.66" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">two-hop path by construction.</text><line x1="64" y1="926" x2="1536" y2="926" stroke="#D8DCE3" stroke-width="1.5" stroke-linecap="butt"/><text x="64" y="954" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">Architecture and quotation: OpenAI technical report on the Hugging Face incident.</text><text x="1536" y="954" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="end">vikramjha.work  ·  fig 5 · reachability</text></svg>