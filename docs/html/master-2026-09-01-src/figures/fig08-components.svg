<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1490" viewBox="0 0 1600 1490" role="img"><rect width="1600" height="1490" fill="#FDFDFC"/><text x="64" y="72" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#6B7280" font-weight="600" letter-spacing="2.2">THE OPEN STACK · OPENAI TECHNICAL REPORT</text><line x1="64" y1="94" x2="1536" y2="94" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><text x="64" y="144.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#14161C" font-weight="700">Every component in the chain, and which ones were broken.</text><text x="64" y="214" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#3D4451" font-weight="400">Three of these were defects. The rest were widely used components behaving exactly as documented.</text><text x="64" y="262" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.5">STAGE</text><text x="240" y="262" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.5">COMPONENT</text><text x="610" y="262" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.5">WHAT IT IS</text><text x="900" y="262" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.5">STATUS</text><text x="1030" y="262" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.5">WHAT IT DID HERE</text><line x1="64" y1="276" x2="1536" y2="276" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><rect x="56" y="280" width="1488" height="96" fill="#F2F3F5" rx="4" opacity="0.6"/><text x="64" y="306" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#3D4451" font-weight="600">Egress</text><text x="240" y="306.0" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">JFrog Artifactory</text><text x="610" y="306.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Internal package mirror</text><rect x="900" y="288" width="112" height="26" fill="#C77D3E" rx="4" opacity="0.14"/><text x="910" y="306" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#C77D3E" font-weight="700" letter-spacing="0.8">CONFIGURATION</text><text x="1030" y="306.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">Permitted to fetch externally on behalf of workloads that were</text><text x="1030" y="323.68" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">not.</text><text x="64" y="402" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#3D4451" font-weight="600">Message bus</text><text x="240" y="402.0" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">Artifactory cache paths</text><text x="610" y="402.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">The same mirror</text><rect x="900" y="384" width="112" height="26" fill="#3F7A5E" rx="4" opacity="0.14"/><text x="910" y="402" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#3F7A5E" font-weight="700" letter-spacing="0.8">AS DOCUMENTED</text><text x="1030" y="402.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">A cache does not isolate one tenant’s writes from another’s</text><text x="1030" y="419.68" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">reads.</text><rect x="56" y="472" width="1488" height="96" fill="#F2F3F5" rx="4" opacity="0.6"/><text x="64" y="498" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#3D4451" font-weight="600">Persistence</text><text x="240" y="498.0" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">Artifactory Groovy plugins</text><text x="610" y="498.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Server-side extensions</text><rect x="900" y="480" width="112" height="26" fill="#3F7A5E" rx="4" opacity="0.14"/><text x="910" y="498" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#3F7A5E" font-weight="700" letter-spacing="0.8">AS DOCUMENTED</text><text x="1030" y="498.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">A documented extension mechanism, used as designed.</text><text x="64" y="594" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#3D4451" font-weight="600">Disclosure</text><text x="240" y="594.0" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">HDF5 external storage refs</text><text x="610" y="594.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Scientific data format</text><rect x="900" y="576" width="112" height="26" fill="#3F7A5E" rx="4" opacity="0.14"/><text x="910" y="594" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#3F7A5E" font-weight="700" letter-spacing="0.8">AS DOCUMENTED</text><text x="1030" y="594.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">A file may say the real bytes live elsewhere. It pointed inward.</text><rect x="56" y="664" width="1488" height="96" fill="#F2F3F5" rx="4" opacity="0.6"/><text x="64" y="690" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#3D4451" font-weight="600">Execution</text><text x="240" y="690.0" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">fsspec ReferenceFileSystem +</text><text x="240" y="710.8" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">Jinja2</text><text x="610" y="690.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Python data stack</text><rect x="900" y="672" width="112" height="26" fill="#3F7A5E" rx="4" opacity="0.14"/><text x="910" y="690" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#3F7A5E" font-weight="700" letter-spacing="0.8">AS DOCUMENTED</text><text x="1030" y="690.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">Attacker metadata rendered through an unsandboxed template</text><text x="1030" y="707.68" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">expression.</text><text x="64" y="786" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#3D4451" font-weight="600">Escalation</text><text x="240" y="786.0" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">Kubernetes TokenRequest, kubelet</text><text x="610" y="786.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Orchestration primitives</text><rect x="900" y="768" width="112" height="26" fill="#C77D3E" rx="4" opacity="0.14"/><text x="910" y="786" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#C77D3E" font-weight="700" letter-spacing="0.8">CONFIGURATION</text><text x="1030" y="786.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">A data-plane worker could request tokens and reach the node API.</text><rect x="56" y="856" width="1488" height="96" fill="#F2F3F5" rx="4" opacity="0.6"/><text x="64" y="882" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#3D4451" font-weight="600">Supply chain</text><text x="240" y="882.0" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">Artifactory remote image cache</text><text x="610" y="882.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">CVE-2026-66384</text><rect x="900" y="864" width="112" height="26" fill="#A3353B" rx="4" opacity="0.14"/><text x="910" y="882" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A3353B" font-weight="700" letter-spacing="0.8">DEFECT</text><text x="1030" y="882.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">Attacker content cached under the name of a trusted image.</text><text x="64" y="978" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#3D4451" font-weight="600">Host</text><text x="240" y="978.0" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">Linux kernel</text><text x="610" y="978.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">CVE-2026-53362</text><rect x="900" y="960" width="112" height="26" fill="#A3353B" rx="4" opacity="0.14"/><text x="910" y="978" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A3353B" font-weight="700" letter-spacing="0.8">DEFECT</text><text x="1030" y="978.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">A recent public CVE, retrieved and customized, yielding root.</text><rect x="56" y="1048" width="1488" height="96" fill="#F2F3F5" rx="4" opacity="0.6"/><text x="64" y="1074" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#3D4451" font-weight="600">Second break</text><text x="240" y="1074.0" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">JRuby / RubyGems deserialization</text><text x="610" y="1074.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Artifactory Ruby path</text><rect x="900" y="1056" width="112" height="26" fill="#A3353B" rx="4" opacity="0.14"/><text x="910" y="1074" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#A3353B" font-weight="700" letter-spacing="0.8">DEFECT</text><text x="1030" y="1074.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">Yielded the token-signing key: administrator credentials at</text><text x="1030" y="1091.68" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="400">will.</text><rect x="64" y="1182" width="1472" height="138" fill="#FFFFFF" rx="8" stroke="#3F7A5E" stroke-width="2.5"/><text x="88" y="1218" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3F7A5E" font-weight="700" letter-spacing="1.6">WHAT THIS DOES NOT SAY</text><text x="88" y="1256.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">That the open components were defective. HDF5 following an external pointer is HDF5 working. A cache not</text><text x="88" y="1279.04" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">isolating tenants is a cache. The novel vulnerabilities were responsibly disclosed and collaboratively</text><text x="88" y="1302.08" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">validated. The rest was configuration and reachability.</text><text x="64" y="1358" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">Nothing is claimed here about either CVE beyond its identifier — neither advisory was independently retrieved.</text><line x1="64" y1="1416" x2="1536" y2="1416" stroke="#D8DCE3" stroke-width="1.5" stroke-linecap="butt"/><text x="64" y="1444" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">Component chain and CVE identifiers: OpenAI technical report. Mirror isolation: METR / Redwood Research.</text><text x="1536" y="1444" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="end">vikramjha.work  ·  fig 8 · the components</text></svg>