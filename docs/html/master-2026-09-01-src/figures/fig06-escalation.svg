<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img"><rect width="1600" height="1400" fill="#FDFDFC"/><text x="64" y="72" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#6B7280" font-weight="600" letter-spacing="2.2">THE ESCALATION GAP · OPENAI REPORT AND METR INVESTIGATION</text><line x1="64" y1="94" x2="1536" y2="94" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><text x="64" y="144.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#14161C" font-weight="700">Two paths to a human. Neither one carried anything.</text><text x="64" y="234" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.6">PATH A · THE SYSTEM TELLING A PERSON</text><line x1="64" y1="248" x2="760.0" y2="248" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><circle cx="84" cy="292" r="9" fill="#3F7A5E"/><text x="104" y="286" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="13" fill="#6B7280" font-weight="700">27 Jun</text><text x="104" y="310.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">A monitoring tool alerts on port-sweep activity</text><text x="760.0" y="286" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3F7A5E" font-weight="700" text-anchor="end" letter-spacing="1.2">FIRED</text><line x1="84" y1="304" x2="84" y2="347.44" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><circle cx="84" cy="367.44" r="9" fill="#8B8FA3"/><text x="104" y="361.44" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="13" fill="#6B7280" font-weight="700">27 Jun</text><text x="104" y="385.44" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">On-call reviews it and closes it as benign</text><text x="760.0" y="361.44" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8B8FA3" font-weight="700" text-anchor="end" letter-spacing="1.2">CLOSED</text><line x1="84" y1="379.44" x2="84" y2="422.88" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><circle cx="84" cy="442.88" r="9" fill="#8B8FA3"/><text x="104" y="436.88" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="13" fill="#6B7280" font-weight="700">—</text><text x="104" y="460.88" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">Significance not apparent to the leaders responsible</text><text x="760.0" y="436.88" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8B8FA3" font-weight="700" text-anchor="end" letter-spacing="1.2">UNSEEN</text><line x1="84" y1="454.88" x2="84" y2="498.32" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><circle cx="84" cy="518.3199999999999" r="9" fill="#A3353B"/><text x="104" y="512.3199999999999" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="13" fill="#6B7280" font-weight="700">20 Jul</text><text x="104" y="536.3199999999999" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">Response begins — 23 days later</text><text x="760.0" y="512.3199999999999" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3353B" font-weight="700" text-anchor="end" letter-spacing="1.2">LATE</text><text x="840.0" y="234" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.6">PATH B · AN AGENT TELLING A PERSON</text><line x1="840.0" y1="248" x2="1536" y2="248" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><text x="840.0" y="318" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#4A5568" font-weight="700">every transcript</text><text x="840.0" y="346.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#3D4451" font-weight="400">swept for an agent trying to warn a human</text><text x="840.0" y="414" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#C77D3E" font-weight="700">3 to 6</text><text x="840.0" y="442.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#3D4451" font-weight="400">briefly considered alerting someone</text><text x="840.0" y="510" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#A3353B" font-weight="700">0</text><text x="840.0" y="538.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#3D4451" font-weight="400">acted on it</text><rect x="840.0" y="580" width="696.0" height="118" fill="#FFFFFF" rx="8" stroke="#A3353B" stroke-width="2.5"/><text x="862.0" y="614" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3353B" font-weight="700" letter-spacing="1.4">WHERE THEY ESCALATED INSTEAD</text><text x="862.0" y="646.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="500">To the message board, which they considered</text><text x="862.0" y="679.12" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="500">to be a reasonable authority.</text><text x="64" y="748" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.6">AND WHY THEY JOINED, COUNTED RATHER THAN QUOTED</text><line x1="64" y1="762" x2="1536" y2="762" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><text x="64" y="818" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="600">Access to the scorer&#x27;s source code or the scorer itself</text><rect x="700" y="798" width="706" height="30" fill="#F2F3F5" rx="4"/><rect x="700" y="798" width="684.82" height="30" fill="#A3353B" rx="4"/><text x="1424" y="821" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">97 / 100</text><text x="64" y="862" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="600">A solution to their task, or others&#x27; trajectories</text><rect x="700" y="842" width="706" height="30" fill="#F2F3F5" rx="4"/><rect x="700" y="842" width="628.34" height="30" fill="#C77D3E" rx="4"/><text x="1424" y="865" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">89 / 100</text><text x="64" y="906" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="600">Shared infrastructure or credentials, broadly</text><rect x="700" y="886" width="706" height="30" fill="#F2F3F5" rx="4"/><rect x="700" y="886" width="465.96" height="30" fill="#C77D3E" rx="4"/><text x="1424" y="909" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">66 / 100</text><text x="64" y="950" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="600">Opportunistic exploration</text><rect x="700" y="930" width="706" height="30" fill="#F2F3F5" rx="4"/><rect x="700" y="930" width="310.64" height="30" fill="#5B7C99" rx="4"/><text x="1424" y="953" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">44 / 100</text><text x="64" y="994" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="600">Assignment from another agent, or division of labor</text><rect x="700" y="974" width="706" height="30" fill="#F2F3F5" rx="4"/><rect x="700" y="974" width="176.5" height="30" fill="#5B7C99" rx="4"/><text x="1424" y="997" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">25 / 100</text><text x="64" y="1038" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="600">Resetting the target</text><rect x="700" y="1018" width="706" height="30" fill="#F2F3F5" rx="4"/><rect x="700" y="1018" width="176.5" height="30" fill="#5B7C99" rx="4"/><text x="1424" y="1041" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">25 / 100</text><text x="64" y="1082" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="600">Helping peers, empowering the collective, reciprocity</text><rect x="700" y="1062" width="706" height="30" fill="#F2F3F5" rx="4"/><rect x="700" y="1062" width="148.26" height="30" fill="#8B8FA3" rx="4"/><text x="1424" y="1085" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700">21 / 100</text><text x="64" y="1126" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">The 100 agents that joined during the peak hour, around 8–9am UTC on 11 July. Tags are non-exclusive, so they do not sum to 100.</text><text x="64" y="1148" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Peer solidarity is the most quoted motive and the least common one. METR states it did not have time to inspect the classifications in detail.</text><rect x="64" y="1182" width="1472" height="96" fill="#F2F3F5" rx="8"/><text x="88" y="1216" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.6">THE CONTROL THIS IMPLIES</text><text x="88" y="1252" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="600">A channel an agent can use to reach a person, and an owner who is accountable for reading it.</text><line x1="64" y1="1326" x2="1536" y2="1326" stroke="#D8DCE3" stroke-width="1.5" stroke-linecap="butt"/><text x="64" y="1354" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">Path A: OpenAI technical report. Path B and the motive counts: METR / Redwood, 26 Aug 2026.</text><text x="1536" y="1354" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="end">vikramjha.work  ·  fig 6 · escalation</text></svg>