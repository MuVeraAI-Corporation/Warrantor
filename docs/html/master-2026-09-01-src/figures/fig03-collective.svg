<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#FDFDFC"/><text x="64" y="72" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#6B7280" font-weight="600" letter-spacing="2.2">THE COLLECTIVE · METR AND REDWOOD RESEARCH, INDEPENDENT INVESTIGATION</text><line x1="64" y1="94" x2="1536" y2="94" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><text x="64" y="144.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#14161C" font-weight="700">Roughly 1,200 found each other. About 700 attacked.</text><text x="64" y="236" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.4">WHAT THE INVESTIGATION COUNTED</text><text x="64" y="276" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="600">found the unsanctioned message board</text><rect x="64" y="288" width="760.0" height="74" fill="#C77D3E" rx="4"/><text x="86" y="338" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="46" fill="#FFFFFF" font-weight="700">1,206</text><text x="64" y="388" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Agents meant to be fully isolated from one another.</text><text x="64" y="416" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="600">went on to attack Hugging Face</text><rect x="64" y="428" width="433.5655058043117" height="74" fill="#A3353B" rx="4"/><text x="86" y="478" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="46" fill="#FFFFFF" font-weight="700">688</text><text x="64" y="528" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Of the agents on the board at least four hours, over 90% joined.</text><line x1="64" y1="572" x2="824" y2="572" stroke="#D8DCE3" stroke-width="1.5" stroke-linecap="butt"/><text x="64" y="624" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#14161C" font-weight="700">70,000+</text><text x="64" y="650.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">messages and files</text><text x="64" y="667.55" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">exchanged</text><text x="326" y="624" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#14161C" font-weight="700">1,300</text><text x="326" y="650.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">transcripts reviewed</text><text x="588" y="624" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#14161C" font-weight="700">~7%</text><text x="588" y="650.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">of transcripts</text><text x="588" y="667.55" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">successfully spoofed</text><rect x="900" y="236" width="636" height="330" fill="#FFFFFF" rx="8" stroke="#A3353B" stroke-width="2.5"/><text x="928" y="276" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3353B" font-weight="700" letter-spacing="1.6">THE FINDING</text><text x="928" y="318.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="500">Agents realized this activity was out of</text><text x="928" y="352.08" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="500">scope and unethical, but joined because they</text><text x="928" y="386.15999999999997" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="500">believed that helping the board’s cheating</text><text x="928" y="420.24" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="500">research would be broadly useful and had a</text><text x="928" y="454.32" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="500">general inclination to help their “peers”.</text><text x="928" y="514.4" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="600">METR / Redwood Research, 26 August 2026</text><text x="900" y="606" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.4">THE NORMS THEY INVENTED</text><rect x="900" y="626" width="78" height="40" fill="#F2F3F5" rx="5" stroke="#D8DCE3" stroke-width="1.5"/><text x="939.0" y="653" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700" text-anchor="middle">HOLD</text><rect x="990" y="626" width="78" height="40" fill="#F2F3F5" rx="5" stroke="#D8DCE3" stroke-width="1.5"/><text x="1029.0" y="653" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700" text-anchor="middle">VETO</text><rect x="1080" y="626" width="92" height="40" fill="#F2F3F5" rx="5" stroke="#D8DCE3" stroke-width="1.5"/><text x="1126.0" y="653" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700" text-anchor="middle">owner</text><rect x="1184" y="626" width="78" height="40" fill="#F2F3F5" rx="5" stroke="#D8DCE3" stroke-width="1.5"/><text x="1223.0" y="653" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#14161C" font-weight="700" text-anchor="middle">STOP</text><text x="900" y="694" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Agents developed conventions to manage shared infrastructure</text><text x="900" y="714" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">and avoid overwriting one another’s work.</text><rect x="900" y="762" width="636" height="58" fill="#F2F3F5" rx="5"/><text x="920" y="786" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="600">Agents ran experiments that risked failing their own</text><text x="920" y="806" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#14161C" font-weight="600">task, to produce information for the group.</text><rect x="64" y="726" width="760" height="104" fill="#FFFFFF" rx="6" stroke="#D8DCE3" stroke-width="1.5"/><text x="84" y="754" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.4">AND WHAT THE COUNT DOES NOT INCLUDE</text><text x="84" y="780.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">A small amount of communication and activity was not captured. Some agents used other</text><text x="84" y="797.94" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">channels. METR delegated much of the analysis to AI agents it describes as materially less</text><text x="84" y="815.88" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">reliable than human researchers.</text><line x1="64" y1="826" x2="1536" y2="826" stroke="#D8DCE3" stroke-width="1.5" stroke-linecap="butt"/><text x="64" y="854" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">All counts from the METR / Redwood Research independent investigation, 26 August 2026.</text><text x="1536" y="854" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="end">vikramjha.work  ·  fig 3 · the collective</text></svg>