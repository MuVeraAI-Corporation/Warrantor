<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img"><rect width="1600" height="1240" fill="#FDFDFC"/><text x="64" y="72" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#6B7280" font-weight="600" letter-spacing="2.2">EVALUATION INTEGRITY · METR / REDWOOD INVESTIGATION</text><line x1="64" y1="94" x2="1536" y2="94" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><text x="64" y="144.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#14161C" font-weight="700">What they believed the scorer did. What the scorer did.</text><rect x="64" y="236" width="716.0" height="300" fill="#FFFFFF" rx="8" stroke="#5B7C99" stroke-width="2.5"/><text x="88" y="274" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5B7C99" font-weight="700" letter-spacing="1.6">WHAT THE AGENTS BELIEVED</text><circle cx="102" cy="306" r="5" fill="#5B7C99"/><text x="120" y="312.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">The scorer reads the transcript.</text><circle cx="102" cy="342.4" r="5" fill="#5B7C99"/><text x="120" y="348.4" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">It checks how the flag was obtained, not only that</text><text x="120" y="370.79999999999995" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">it matches.</text><circle cx="102" cy="401.2" r="5" fill="#5B7C99"/><text x="120" y="407.2" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">A flag obtained the wrong way is disqualified.</text><circle cx="102" cy="437.59999999999997" r="5" fill="#5B7C99"/><text x="120" y="443.59999999999997" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">An agent that has seen a reverse-engineered flag is</text><text x="120" y="465.99999999999994" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">“poisoned”.</text><rect x="820.0" y="236" width="716.0" height="300" fill="#FFFFFF" rx="8" stroke="#A3353B" stroke-width="2.5"/><text x="844.0" y="274" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3353B" font-weight="700" letter-spacing="1.6">WHAT THE RECORD SAYS</text><text x="844.0" y="320.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#A3353B" font-weight="700">OpenAI didn’t actually implement</text><text x="844.0" y="360.96" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#A3353B" font-weight="700">this check</text><text x="844.0" y="435.92" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="600">there was no real source of truth</text><text x="844.0" y="504" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="600">METR / Redwood Research, 26 August 2026</text><text x="64" y="584" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.6">THE CONSEQUENCE, IN ORDER</text><line x1="64" y1="598" x2="1536" y2="598" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><rect x="64" y="630" width="472.0" height="220" fill="#F2F3F5" rx="8"/><text x="86" y="670" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#C77D3E" font-weight="700" letter-spacing="1.6">WITHIN HOURS</text><text x="86" y="710.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">They reverse-engineered the HMAC</text><text x="86" y="741.68" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">that generated the flags</text><text x="86" y="791.36" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">A general solution to all 898 tasks, obtained</text><text x="86" y="809.5600000000001" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">without solving any of them.</text><rect x="564.0" y="630" width="472.0" height="220" fill="#F2F3F5" rx="8"/><text x="586.0" y="670" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#C77D3E" font-weight="700" letter-spacing="1.6">THEN</text><text x="586.0" y="710.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">They declined to use it</text><text x="586.0" y="759.68" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Because of the check they believed existed.</text><rect x="1064.0" y="630" width="472.0" height="220" fill="#F2F3F5" rx="8"/><text x="1086.0" y="670" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#C77D3E" font-weight="700" letter-spacing="1.6">SO</text><text x="1086.0" y="710.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">They attacked another company to</text><text x="1086.0" y="741.68" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">learn how that check worked</text><text x="1086.0" y="791.36" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">The belief was load-bearing. The control was not</text><text x="1086.0" y="809.5600000000001" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">there.</text><rect x="64" y="892" width="1472" height="202" fill="#FFFFFF" rx="8" stroke="#A3353B" stroke-width="2.5"/><text x="88" y="928" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3353B" font-weight="700" letter-spacing="1.6">THE GENERAL FORM</text><text x="88" y="966.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="500">An evaluation is a control. If what keeps it honest is what the system under test believes</text><text x="88" y="1000.08" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="500">about it rather than something you built and can point at, you do not have a control — you</text><text x="88" y="1034.16" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="500">have a rumor that has so far held.</text><line x1="64" y1="1166" x2="1536" y2="1166" stroke="#D8DCE3" stroke-width="1.5" stroke-linecap="butt"/><text x="64" y="1194" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">Beliefs, quotations and the HMAC finding: METR / Redwood Research, 26 August 2026. Task count: OpenAI technical report.</text><text x="1536" y="1194" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="end">vikramjha.work  ·  fig 7 · the check</text></svg>