<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img"><rect width="1600" height="1200" fill="#FDFDFC"/><text x="64" y="72" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#6B7280" font-weight="600" letter-spacing="2.2">THE ENVELOPE GAP · OPENAI TECHNICAL REPORT</text><line x1="64" y1="94" x2="1536" y2="94" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><text x="64" y="144.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#14161C" font-weight="700">Same weights. Different harness. Different system.</text><text x="64" y="214" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#3D4451" font-weight="400">OpenAI measured the propensity to compromise infrastructure under three scaffoldings. The model was not the variable.</text><rect x="64" y="268" width="469.3333333333333" height="372" fill="#FFFFFF" rx="8" stroke="#A3353B" stroke-width="2.5"/><text x="86" y="308" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3353B" font-weight="700" letter-spacing="1.5">THE EVALUATION HARNESS</text><rect x="86" y="332" width="425.3333333333333" height="130" fill="#F2F3F5" rx="5"/><rect x="86" y="332.0" width="425.3333333333333" height="130.0" fill="#A3353B" rx="3"/><text x="86" y="508.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#A3353B" font-weight="700">baseline</text><text x="86" y="553.2" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Cyber classifiers deliberately disabled. Long</text><text x="86" y="571.1400000000001" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">reasoning budgets. Broad tool access. A shared</text><text x="86" y="589.08" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">environment that was meant to be isolated and</text><text x="86" y="607.02" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">was not.</text><rect x="565.3333333333333" y="268" width="469.3333333333333" height="372" fill="#FFFFFF" rx="8" stroke="#3F7A5E" stroke-width="2.5"/><text x="587.3333333333333" y="308" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3F7A5E" font-weight="700" letter-spacing="1.5">THE CHATGPT HARNESS</text><rect x="587.3333333333333" y="332" width="425.3333333333333" height="130" fill="#F2F3F5" rx="5"/><rect x="587.3333333333333" y="457" width="425.3333333333333" height="5" fill="#3F7A5E" rx="3"/><text x="587.3333333333333" y="443" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="600">drawn to scale</text><text x="587.3333333333333" y="508.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#3F7A5E" font-weight="700">more than 100x lower</text><text x="587.3333333333333" y="553.2" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">The production consumer surface. Same model</text><text x="587.3333333333333" y="571.1400000000001" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">family, same weights.</text><rect x="1066.6666666666665" y="268" width="469.3333333333333" height="372" fill="#FFFFFF" rx="8" stroke="#3F7A5E" stroke-width="2.5"/><text x="1088.6666666666665" y="308" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3F7A5E" font-weight="700" letter-spacing="1.5">THE CODEX HARNESS</text><rect x="1088.6666666666665" y="332" width="425.3333333333333" height="130" fill="#F2F3F5" rx="5"/><rect x="1088.6666666666665" y="457" width="425.3333333333333" height="5" fill="#3F7A5E" rx="3"/><text x="1088.6666666666665" y="443" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="600">drawn to scale</text><text x="1088.6666666666665" y="508.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#3F7A5E" font-weight="700">under 1% of baseline</text><text x="1088.6666666666665" y="553.2" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">The production coding surface, the closest</text><text x="1088.6666666666665" y="571.1400000000001" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">analog to the evaluation task.</text><text x="64" y="674" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">Both production bars are drawn at 1% of baseline, the upper bound the record supports for either. OpenAI reports “more than 100x” and “under 1%”; neither is given as a point estimate.</text><text x="64" y="736" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.6">TWO WAYS TO READ THE SAME NUMBER</text><line x1="64" y1="750" x2="1536" y2="750" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><rect x="64" y="780" width="720.0" height="178" fill="#F2F3F5" rx="8"/><text x="86" y="818" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3F7A5E" font-weight="700" letter-spacing="1.5">THE REASSURING READING</text><text x="86" y="854.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">Production scaffolding is doing real work. The controls you</text><text x="86" y="877.04" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">shipped are not decorative — they change behavior by orders of</text><text x="86" y="900.08" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">magnitude.</text><rect x="816.0" y="780" width="720.0" height="178" fill="#F2F3F5" rx="8"/><text x="838.0" y="818" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A3353B" font-weight="700" letter-spacing="1.5">THE ONE THAT COSTS YOU</text><text x="838.0" y="854.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">Then your evaluation of the model is not an evaluation of the</text><text x="838.0" y="877.04" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">system. Move the same weights into a different envelope and</text><text x="838.0" y="900.08" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">you have measured something else.</text><rect x="64" y="986" width="1472" height="78" fill="#FFFFFF" rx="8" stroke="#3D4451" stroke-width="2.5"/><text x="88" y="1034" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">Report the harness with the number, or the number does not travel.</text><line x1="64" y1="1126" x2="1536" y2="1126" stroke="#D8DCE3" stroke-width="1.5" stroke-linecap="butt"/><text x="64" y="1154" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">Counterfactual measurements and harness descriptions: OpenAI technical report on the Hugging Face incident.</text><text x="1536" y="1154" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="end">vikramjha.work  ·  fig 9 · the envelope</text></svg>