<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img"><rect width="1600" height="1400" fill="#FDFDFC"/><text x="64" y="72" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#6B7280" font-weight="600" letter-spacing="2.2">METHOD · METR / REDWOOD RESEARCH, INVESTIGATION APPENDIX</text><line x1="64" y1="94" x2="1536" y2="94" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><text x="64" y="144.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="32" fill="#14161C" font-weight="700">How the record was made, disclosed by the people who made it.</text><text x="64" y="214" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#3D4451" font-weight="400">Planned as two days on premises. It became three visits over eighteen days, and the dataset grew sixteenfold.</text><rect x="64" y="262" width="6" height="74" fill="#C77D3E" rx="3"/><text x="88" y="288" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#3D4451" font-weight="700">29–31 Jul</text><text x="234" y="288" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">First period on premises</text><text x="234" y="314.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">~80 selected transcripts, ~150,000 reconstructed board entries. Later, ~200 more transcripts and the full ~1.2M-entry dump. Roughly</text><text x="234" y="331.94" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">eight researchers interviewed.</text><rect x="64" y="354" width="6" height="74" fill="#5B7C99" rx="3"/><text x="88" y="380" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#3D4451" font-weight="700">1–2 Aug</text><text x="234" y="380" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">First draft, first round of feedback</text><text x="234" y="406.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">METR states it could not draw confident conclusions: substantial uncertainty about dataset construction and completeness.</text><rect x="64" y="446" width="6" height="74" fill="#5B7C99" rx="3"/><text x="88" y="472" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#3D4451" font-weight="700">3 Aug</text><text x="234" y="472" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">METR proposes a broader dataset</text><text x="234" y="498.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">OpenAI chose to proceed with the existing data, stating the complete scope would have required substantial additional time to</text><text x="234" y="515.94" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">reconstruct.</text><rect x="64" y="538" width="6" height="74" fill="#C77D3E" rx="3"/><text x="88" y="564" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#3D4451" font-weight="700">5–6 Aug</text><text x="234" y="564" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">Second period on premises</text><text x="234" y="590.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">~285 transcripts. Timestamps reconstructed, messages traced to the agents that wrote and read them.</text><rect x="64" y="630" width="6" height="74" fill="#5B7C99" rx="3"/><text x="88" y="656" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#3D4451" font-weight="700">12 Aug</text><text x="234" y="656" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">Feedback, redactions, and a replication</text><text x="234" y="682.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">OpenAI&#x27;s own replication indicated the fraction of agent activity in METR&#x27;s dataset was roughly 30%.</text><rect x="64" y="722" width="6" height="74" fill="#C77D3E" rx="3"/><text x="88" y="748" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#3D4451" font-weight="700">15–16 Aug</text><text x="234" y="748" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">Third period on premises</text><text x="234" y="774.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">~1,200 more transcripts. METR could now verify its final dataset held the vast majority of agent activity.</text><rect x="64" y="814" width="6" height="74" fill="#5B7C99" rx="3"/><text x="88" y="840" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#3D4451" font-weight="700">19–24 Aug</text><text x="234" y="840" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">Three further rounds of feedback and redaction</text><text x="234" y="866.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Report submitted, redacted, resubmitted, redacted again.</text><rect x="64" y="906" width="6" height="74" fill="#3F7A5E" rx="3"/><text x="88" y="932" font-family="'IBM Plex Mono','SF Mono',Consolas,'Liberation Mono',monospace" font-size="16" fill="#3D4451" font-weight="700">26 Aug</text><text x="234" y="932" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#14161C" font-weight="700">Published simultaneously with OpenAI&#x27;s post-mortem</text><text x="234" y="958.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">METR had not seen OpenAI&#x27;s report before publishing.</text><text x="64" y="1014" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.6">THE TRANSCRIPT SET, VISIT BY VISIT</text><line x1="64" y1="1028" x2="760.0" y2="1028" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><text x="64" y="1080" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="46" fill="#C77D3E" font-weight="700">80</text><text x="64" y="1106" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">first visit</text><text x="264" y="1080" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="46" fill="#C77D3E" font-weight="700">285</text><text x="264" y="1106" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">second</text><text x="464" y="1080" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="46" fill="#C77D3E" font-weight="700">1,300</text><text x="464" y="1106" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">third</text><text x="840.0" y="1014" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.6">AND HOW COMPLETE THE FINAL SET WAS</text><line x1="840.0" y1="1028" x2="1536" y2="1028" stroke="#D8DCE3" stroke-width="2" stroke-linecap="butt"/><text x="840.0" y="1060.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">Of 100 randomly sampled non-file messages, an analysis agent traced 93 to the exact tool</text><text x="840.0" y="1078.46" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">call that wrote them. METR&#x27;s reading: the agents in its dataset account for well over</text><text x="840.0" y="1096.92" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">95% of board activity, and the datasets capture a bit over 90% of it — with 3–4% of</text><text x="840.0" y="1115.38" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#3D4451" font-weight="400">agent activity after encountering the board lost to container resets.</text><rect x="64" y="1152" width="1472" height="134" fill="#FFFFFF" rx="8" stroke="#3D4451" stroke-width="2.5"/><text x="88" y="1188" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="700" letter-spacing="1.6">WHY THIS BELONGS NEXT TO EVERY NUMBER</text><text x="88" y="1222.0" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">The independent record improved materially each time its authors were given more data — which means the first</text><text x="88" y="1245.04" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">version of it was wrong in ways its authors could not see. That is the disclosed method working, and it is also</text><text x="88" y="1268.08" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#14161C" font-weight="400">the reason to read the caveats.</text><line x1="64" y1="1326" x2="1536" y2="1326" stroke="#D8DCE3" stroke-width="1.5" stroke-linecap="butt"/><text x="64" y="1354" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400">Every item on this figure is disclosed by METR in its own investigation and methodology appendices, 26 August 2026.</text><text x="1536" y="1354" font-family="'IBM Plex Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="end">vikramjha.work  ·  fig 10 · method</text></svg>