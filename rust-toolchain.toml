# Pins what CI and contributors actually install.
#
# `rust-version = "1.85"` in rust/Cargo.toml declares the floor and cargo enforces it. This file is
# the other half: without it CI builds on whatever its image happens to ship, so a toolchain bump
# in the runner image can break or silently fix the build with no change in this repository.
#
# `stable` rather than a fixed version because clippy at `-D warnings` is part of the gate and new
# lints land in new stables; discovering those on our schedule beats discovering them when a
# contributor's PR reds for a reason they did not cause.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
