[package]
name = "warrantor-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Generated Warrantor API types (prost/tonic) — the Rust view of the contract plane"
# Ship the vendored protos: build.rs needs them, and cargo package only includes
# files inside the crate directory.
include = ["src/**/*", "proto/**/*", "build.rs", "Cargo.toml", "README.md"]
# Sources are generated by build.rs into OUT_DIR on every `cargo build`; nothing is committed.
# There is no manual regeneration step and no `src/generated/` directory.
build = "build.rs"

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
# tonic 0.14 has no prost dependency: the prost codec moved out of the runtime into
# `tonic-prost`, and the prost codegen into `tonic-prost-build`. The generated code
# names `tonic_prost::ProstCodec`, so this is a direct dependency of what build.rs
# writes, not an optional feature of tonic.
tonic-prost = "0.14"
serde.workspace = true

[build-dependencies]
tonic-prost-build = "0.14"

[lib]
name = "warrantor_api"
path = "src/lib.rs"
