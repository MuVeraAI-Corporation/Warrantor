[package]
name = "warrantor-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Generated AumOS API types (prost/tonic) — the Rust view of the contract plane"
# Sources are generated by build.rs into OUT_DIR on every `cargo build`; nothing is committed.
# There is no manual regeneration step and no `src/generated/` directory.
build = "build.rs"

[dependencies]
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
serde.workspace = true

[build-dependencies]
tonic-build = "0.14"

[lib]
name = "warrantor_api"
path = "src/lib.rs"
