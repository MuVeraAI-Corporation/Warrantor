[package]
name = "warrantor-credential-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Agent-scoped credential brokering — 15-min TTL, <1s revocation"

[lib]
name = "warrantor_credential_vault"
path = "src/lib.rs"

[[bin]]
name = "credential-vault"
path = "src/cli.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
clap.workspace = true
regex = "1"
# Real HashiCorp Vault integration (AX: "not yet wired (task 03)").
# ureq over reqwest deliberately: pure-Rust, rustls, no async runtime, ~5x smaller
# dependency tree. This crate brokers credentials, so its transitive surface is
# part of its threat model.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
