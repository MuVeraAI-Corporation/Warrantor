[package]
name = "warrantor-trust-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_cbor = "0.11"
serde_json = "1"
ed25519-dalek = "3"

[dependencies.warrantor-trust-core]
path = ".."

[[bin]]
name = "canonical_cbor"
path = "fuzz_targets/canonical_cbor.rs"
test = false
doc = false

[[bin]]
name = "signature_decode"
path = "fuzz_targets/signature_decode.rs"
test = false
doc = false

[[bin]]
name = "rekor_response"
path = "fuzz_targets/rekor_response.rs"
test = false
doc = false

[workspace]
