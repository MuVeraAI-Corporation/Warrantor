[package]
name = "warrantor-data-plane"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "DP1 Data plane — GDPR right-to-erasure vs append-only transparency log (tombstone + redaction layer), retention/pruning/compaction, tiered storage, dev-facing lifecycle config."

[lib]
name = "warrantor_data_plane"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
