[package]
name = "warrantor-gguf-ext"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "S3 — bounded GGUF v3 reader, writer, digest, and signed safety profile"

[lib]
name = "warrantor_gguf_ext"
path = "src/lib.rs"

[[bin]]
name = "gguf-ext"
path = "src/bin/gguf-ext.rs"

[dependencies]
clap.workspace = true
ed25519-dalek = "3"
hex = "0.4"
serde.workspace = true
serde_json = "1"
serde_jcs = "=0.2.0"
sha2 = "0.11"
tempfile = "3"
thiserror.workspace = true
zeroize.workspace = true
warrantor-trust-core = { path = "../trust-core" }

[dev-dependencies]
proptest = "=1.11.0"
