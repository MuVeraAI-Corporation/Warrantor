[package]
name = "warrantor-warrant"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "The warrant: bounded authority granted in advance, answerable afterwards (W1)."
# The console's behaviour tests live beside the asset they test, because `console.js` is the page's
# entry module and the test boots it against a stubbed DOM under `node --test`. They belong in the
# repository, not in the published crate: nothing cargo builds reads them.
exclude = ["src/console/console.test.js"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
hex = "0.4"
digest = "0.11"
hmac = "0.13"
sha2 = "0.11"
# `version` alongside `path` is what cargo publish requires: the path is used in this
# workspace, the version is what downstream users resolve from the registry. Without it,
# publish refuses -- correctly, since a published crate cannot depend on a local path.
warrantor-trust-core = { path = "../trust-core", version = "1.0.0" }
warrantor-authority-spec = { path = "../authority-spec", version = "1.0.0" }
# The report's two signing planes. Neither adds an external crate: both depend on exactly
# {thiserror, serde, serde_json, ed25519-dalek, getrandom, sha2}, all of which this crate already
# carries at the same versions, and both ship their own private `mod hex`. The 7-external-dep,
# tokio-free posture is unchanged.
warrantor-evidence = { path = "../evidence", version = "1.0.0" }
warrantor-notary = { path = "../notary", version = "1.0.0" }
# The egress broker, behind the proxy's egress bound. Same dependency family again -- it adds no
# external crate and no new version to Cargo.lock. It decides; it does not enforce: enforcement
# still terminates at the MCP proxy, exactly where it did before.
warrantor-egress = { path = "../egress", version = "1.0.0" }
# The containment conformance suite, behind `warrantor stop`. It is a report VALIDATOR, not a
# conformance runner: it cannot measure quiescence and cannot elicit, so what it buys is the
# anti-sandbagging gate -- a stop record can never claim a passing containment grade, because
# warrantor never runs an elicitation. Same dependency family minus sha2; no new external crate.
#
# `warrantor-kill-switch-core` is the kill switch's process-tree termination, extracted because
# the full crate declares tokio, clap and tracing unconditionally. The core depends on thiserror
# only.
warrantor-containment-conformance = { path = "../containment-conformance", version = "1.0.0" }
warrantor-kill-switch-core = { path = "../kill-switch-core", version = "1.0.0" }
# The spend engine, behind the budget bound. It does NOT make that bound enforceable and does not
# try: model API calls never traverse this process, so every figure it can see is one the agent
# reported about itself. What it buys is that `budget_cents_observed` becomes TRUE -- before this,
# nothing in the system read the number at all, so a bound labelled "observed" was observed by
# nobody. Same dependency family again; no new external crate and no new version in Cargo.lock.
warrantor-spend = { path = "../spend", version = "1.0.0" }
# The credential vault, behind invariant I-05's revocation bound. `default-features = false`
# deliberately: that crate's CLI and its credential scanner are feature-gated, so this edge adds
# ZERO external packages to this crate's normal-dependency tree and no line to Cargo.lock. The
# 7-external-dep, tokio-free posture is unchanged. Measured: the tree goes 156 -> 157 packages, and
# the one added package is `warrantor-credential-vault` itself.
#
# What this buys is that I-05 stops being orphaned. The vault's 1-second `REVOKE_BUDGET` and its
# `fsync`'d, replay-at-open revocation journal were real, tested, and unreachable from the product;
# `crate::revoke` reads that journal format, so the number binds a shipped code path and the
# notary's `revoked_svids` seam stops being filled with `Vec::new()`.
#
# What it does NOT buy: fan-out. That crate's own comment promises replica propagation via Kafka
# CloudEvents; no broker is linked here and none is claimed. Propagation stays Observed, and the
# report says so in as many words.
warrantor-credential-vault = { path = "../credential-vault", version = "1.0.0", default-features = false }
# The fail-closed pre-flight, behind `crate::scorer` and `warrantor scorer`. It was ORPHANED: the
# sharpest expression of invariant I-09 in this repository -- refuse to start an agent when the
# boundary it is meant to be measured against could not be measured -- lived in a crate the
# `warrantor` binary did not link, so the refusal could not fire for any user of the shipped
# product. `evidence/invariants.json` recorded I-09 as orphaned for exactly this reason.
#
# It adds no external crate and no line to Cargo.lock. Measured rather than assumed: eval-guard's
# whole dependency set is {thiserror, serde, serde_json, clap, ed25519-dalek, getrandom, hex,
# warrantor-api}, and every one of those is already in this crate's normal-dependency tree -- clap
# and warrantor-api both arrive via warrantor-trust-core. `cargo tree -p warrantor-warrant -e normal`
# gains exactly one unique entry, and that entry is warrantor-eval-guard itself.
#
# What it does NOT buy, and this is the part that had to be fixed BEFORE the wire: eval-guard
# measures nothing. Its own module doc says so -- no eBPF, no sockets, no namespaces. Its CLI used to
# default the four booleans to all-pass, so the shipped binary emitted a signed "four boundaries
# held" on a host with no sandbox on it. Wiring THAT in would have raised the wiring census by
# putting a manufactured claim on the product's main path. `Provenance` is now a required argument
# that participates in the signed bytes, and `crate::scorer::preflight` always passes
# `Provenance::Asserted` -- because a confinement choice is something an operator tells this
# process, and nothing here measures a kernel.
#
# `warrantor-sandbox-runtime` is deliberately NOT here, and the reason is recorded rather than left
# implicit so the next census reader does not "fix" it. It carries `wasmtime = "=47.0.3"` with
# cranelift, and what it bounds is a WebAssembly guest -- while the grader in this product is a
# native process reading a JSONL file. It is consulted as the REFERENCE for what an attempt-time
# refusal looks like (`SandboxError::ImportDenied` at admission, `CAPABILITY_DENIED_MARKER` at the
# call itself) and it is not linked.
warrantor-eval-guard = { path = "../eval-guard", version = "1.0.0" }

getrandom = { version = "0.4", features = ["sys_rng"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Server-side TLS, behind a feature that is OFF by default.
#
# `rustls` is ALREADY in this crate's dependency tree: `ureq`'s `tls` feature pulls it, and has
# since the archive client existed. So terminating TLS here adds no crate to the graph and no line
# to Cargo.lock -- it compiles code that was already being compiled. That is the whole reason this
# is a small change rather than the dependency decision it was previously deferred as.
#
# Off by default anyway. The default build of this crate should be the smallest thing that can
# verify a receipt, and a server that binds loopback needs no TLS at all -- `bind_refusal` makes
# that the only unacknowledged binding a default build permits.
#
# `rustls-pemfile` IS new, and it is 300 lines of PEM parsing with no dependencies of its own beyond
# the pki-types crate rustls already carries. Writing that by hand to avoid one dev-shaped
# dependency would be the wrong trade on a file format where a parsing mistake means loading the
# wrong key.
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring"] }
rustls-pemfile = { version = "2", optional = true }

[features]
default = []
tls = ["dep:rustls", "dep:rustls-pemfile"]

[[bin]]
name = "warrantor"
path = "src/bin/warrantor.rs"
