[package]
name = "warrantor-evidence"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "W2 Evidence envelope — the signed pre_commit→post_commit chaining (spec 01 WAR v2.0). Merges flight-recorder; one envelope carrying pre-auth proof, delegation-chain intersection, outcome, enforcement mode."

[lib]
name = "warrantor_evidence"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
sha2 = "0.11"
# The one delegation algebra (L6-01). This crate maps a receipt's DelegationLink to the
# delegation-chain scope type and asks that crate whether the chain narrows; it computes no
# intersection of its own. `hex 0.4` is the only crate it brings, and warrantor-warrant already
# pins that version, so Cargo.lock gains no new package.
warrantor-delegation-chain = { path = "../delegation-chain", version = "1.0.0" }

[dev-dependencies]
# Dev-only, and deliberately so. The F-02 gate is stated *per effect class*, and the class taxonomy
# lives in authority-spec; importing it means the test iterates the real enum instead of a list of
# strings that would silently go stale when a class is added. tools/ci/wiring_census.py counts only
# the shipping dependency table, so this adds no shipping edge and does not move the census.
warrantor-authority-spec = { path = "../authority-spec", version = "1.0.0" }
