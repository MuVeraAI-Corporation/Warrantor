[package]
name = "warrantor-evidence"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "W2 Evidence envelope — the signed pre_commit→post_commit chaining (spec 01 WAR v2.0). Merges flight-recorder; one envelope carrying pre-auth proof, delegation-chain intersection, outcome, enforcement mode."

[lib]
name = "warrantor_evidence"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
sha2 = "0.11"
