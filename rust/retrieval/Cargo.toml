[package]
name = "warrantor-retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "W7 Retrieval broker — RAG security (the #1 hardest 2026 dev pain). Default-deny retrieval; poisoned-chunk detection; per-tenant isolation; retrieval receipts. The retrieval-plane analog of the W5 egress broker."

[lib]
name = "warrantor_retrieval"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
sha2 = "0.11"
