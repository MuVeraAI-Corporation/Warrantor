[package]
name = "warrantor-spend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "W9 Spend/budget engine — per-agent USD caps, per-task token/call budgets, cost-aware model routing, cost receipts. Spend is an authority decision enforced pre-call."

[lib]
name = "warrantor_spend"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
sha2 = "0.10"
