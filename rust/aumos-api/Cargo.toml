[package]
name = "aumos-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Generated AumOS API types (prost/tonic) — the Rust view of the contract plane"
# Generated sources live in src/generated/. Regenerate with `buf generate` from the repo root.
build = "build.rs"

[dependencies]
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
serde.workspace = true

[build-dependencies]
tonic-build = "0.12"

[lib]
name = "aumos_api"
path = "src/lib.rs"
