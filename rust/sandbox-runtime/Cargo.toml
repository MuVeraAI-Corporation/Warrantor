[package]
name = "warrantor-sandbox-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "R8 — capability-scoped, audited Wasmtime sandbox runtime"

[lib]
name = "warrantor_sandbox_runtime"
path = "src/lib.rs"

[dependencies]
ed25519-dalek = "3"
hex = "0.4"
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
wasmtime = { version = "=45.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }
warrantor-trust-core = { path = "../trust-core" }

[dev-dependencies]
wat = "1"
