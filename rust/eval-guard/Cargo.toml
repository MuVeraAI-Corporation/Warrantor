[package]
name = "warrantor-eval-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Signs and fail-closed-verifies caller-asserted sandbox boundary results (does not itself probe the sandbox)"

[lib]
name = "warrantor_eval_guard"
path = "src/lib.rs"

[[bin]]
name = "eval-guard"
path = "src/cli.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
clap.workspace = true
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4"
warrantor-api = { path = "../warrantor-api" }

[dev-dependencies]
proptest = "1"
