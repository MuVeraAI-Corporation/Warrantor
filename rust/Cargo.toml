[workspace]
resolver = "2"
members = [
    "warrantor-api",
    "authority-spec",
    "trust-core",
    "defstack-cli",
    "nvtrust-bridge",
    "eval-guard",
    "kill-switch",
    "policy-bridge",
    "protocol-contracts",
    "credential-vault",
    "flight-recorder",
    "gguf-ext",
    "safe-tensors-pp",
    "sandbox-runtime",
    "secure-workspace",
    "provena-chain",
    "inference-proxy",
    "confidential-fabric",
    "egress-filter",
    "exfil-guard",
    "warrant",
    "archive",
    "agent-manifest",
    "notary",
    "evidence",
    "egress",
    "retrieval",
    "spend",
    "computer-use",
    "self-governance",
    "containment-conformance",
    "post-quantum",
    "plugin-api",
    "responsible-ai",
    "data-plane",
    "content-moderation",
    "csam-defense",
    "misinformation-defense",
    "reputation",
]
exclude = [
    "trust-core/fuzz",  # nested cargo-fuzz workspace (own [workspace] table)
    "gguf-ext/fuzz",    # bounded parser/profile fuzz workspace
]

[workspace.package]
version = "1.0.0"
edition = "2021"
# Floor set by wasmtime 47's cranelift crates, which require 1.94. It was 1.85 (ed25519-dalek 3 and
# curve25519-dalek 5) until the wasmtime =45.0.1 -> =47.0.3 bump in #11, which raised the real floor
# nine minors without touching this line.
#
# Declared rather than discovered: without it the build passes on whatever toolchain the CI image
# happens to ship, and a contributor on an older one gets an error naming a transitive dependency
# instead of a requirement. That is not hypothetical -- it is exactly what #11 produced on a 1.93.1
# box: `cranelift-assembler-x64@0.134.3 requires rustc 1.94.0`, twenty times, naming no requirement
# of this repository. CI never saw it because `rust-toolchain.toml` says `stable` and CI's stable
# was already past 1.94, so the floor this line exists to state was the only thing that could have
# caught it, and it was stale.
#
# Raising it is the honest move rather than the convenient one: 1.94 is what the tree needs, and a
# declared floor that is nine minors below the truth is worse than none. Reverting wasmtime to 45
# is the alternative if 1.85 must hold. `cargo` enforces this; the toolchain file beside it pins
# what CI actually installs.
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Warrantor contributors"]
repository = "https://github.com/MuVeraAI-Corporation/Warrantor"
description = "Warrantor — Open authority and evidence layer for autonomous systems"
publish = false  # Local dev releases only during Wave-1 (per scope boundary)

[workspace.dependencies]
# Shared across crates. Pin to avoid surprise upgrades.
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
zeroize = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
