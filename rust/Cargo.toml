[workspace]
resolver = "2"
members = [
    "warrantor-api",
    "authority-spec",
    "trust-core",
    "defstack-cli",
    "nvtrust-bridge",
    "eval-guard",
    "kill-switch",
    "policy-bridge",
    "protocol-contracts",
    "credential-vault",
    "flight-recorder",
    "gguf-ext",
    "safe-tensors-pp",
    "sandbox-runtime",
    "secure-workspace",
    "provena-chain",
    "inference-proxy",
    "confidential-fabric",
    "egress-filter",
    "exfil-guard",
    "warrant",
    "agent-manifest",
    "notary",
    "evidence",
    "egress",
    "retrieval",
    "spend",
    "computer-use",
    "self-governance",
    "containment-conformance",
]
exclude = [
    "trust-core/fuzz",  # nested cargo-fuzz workspace (own [workspace] table)
    "gguf-ext/fuzz",    # bounded parser/profile fuzz workspace
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["AumOS contributors"]
repository = "https://github.com/MuVeraAI-Corporation/Warrantor"
description = "AumOS — Open authority and evidence layer for autonomous systems"
publish = false  # Local dev releases only during Wave-1 (per scope boundary)

[workspace.dependencies]
# Shared across crates. Pin to avoid surprise upgrades.
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
zeroize = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
