[package]
name = "warrantor-safe-tensors-pp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "S1 — Safetensors++ : drop-in extension adding signed __provenance__ metadata"

[lib]
name = "warrantor_safe_tensors_pp"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
