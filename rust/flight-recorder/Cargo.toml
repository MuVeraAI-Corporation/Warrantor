[package]
name = "warrantor-flight-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "E1 — verifiable agent flight recorder; emits signed Agent Action Receipts (P2 AAR) pre-commit"

[lib]
name = "warrantor_flight_recorder"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4"
sha2 = "0.11"
# Cross-platform advisory file locking (flock on POSIX, LockFileEx on Windows). Needed so two
# recorders cannot share an evidence log and hand out contradictory durability proofs.
fs4 = "0.8"
uuid = { version = "1", features = ["v4"] }
prost-types = "0.13"
warrantor-api = { path = "../warrantor-api" }

[dev-dependencies]
proptest = "1"
