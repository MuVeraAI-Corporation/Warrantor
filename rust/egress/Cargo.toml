[package]
name = "warrantor-egress"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "W5 Egress broker — model-belief-independent, default-deny network enforcement (spec 08). The agent never supplies a destination; the broker resolves a capability via a signed catalog."

[lib]
name = "warrantor_egress"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
sha2 = "0.11"
# THE WIRING EDGE. `warrantor-egress` is already reachable from the `warrantor` binary, so one edge
# below it puts the deny floor (L4-25) and its single shared address matcher on the shipping path and
# moves `warrantor-egress-filter` off the orphan list in `evidence/wiring-coverage.json`. Its
# dependency set {thiserror, serde, serde_json} is a strict subset of this crate's, so the edge adds
# no external crate and no new package to `rust/Cargo.lock`.
warrantor-egress-filter = { path = "../egress-filter", version = "1.0.0" }
