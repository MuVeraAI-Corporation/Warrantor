[project]
name = "aumos-retention"
version = "1.0.0"
description = "AumOS data retention policy engine and GDPR right-to-erasure (tombstone) support"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "MuVera AI" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
