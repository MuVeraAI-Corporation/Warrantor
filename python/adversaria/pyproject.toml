[project]
name = "warrantor-adversaria"
version = "1.0.0"
description = "A2 — unified adversarial testing framework wrapping garak + PyRIT, with built-in attack generators"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Warrantor contributors" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4"]
garak = ["garak"]
pyrit = ["pyrit"]

[project.scripts]
adversaria = "adversaria.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
