[project]
name = "warrantor-attesta-flow"
version = "1.0.0"
description = "C1-3 — end-to-end attested inference pipeline orchestrator"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
[project.scripts]
attesta-flow = "attesta_flow.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
