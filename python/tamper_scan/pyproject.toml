[project]
name = "aumos-tamper-scan"
version = "1.0.0"
description = "S7 — model tamper detection scanner (weight/backdoor/pruning/fine-tune detectors)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "AumOS contributors" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4"]
numpy = ["numpy>=1.26"]

[project.scripts]
tamper-scan = "tamper_scan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
