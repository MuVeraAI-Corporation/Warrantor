[project]
name = "warrantor-notary"
version = "1.0.0"
description = "W1 Notary — third-party Verify path for WAR receipts. The verdict function is implemented once in Rust (spec 11 §1); this package verifies the receipts the Rust notary issues, with no privileged access."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Warrantor contributors" }]
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
