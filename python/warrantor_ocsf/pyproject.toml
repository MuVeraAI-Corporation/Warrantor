[project]
name = "warrantor-ocsf"
version = "1.0.0"
description = "AumOS OCSF forwarder — convert AAR events to OCSF and ship to SIEM sinks"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "MuVera AI" }]
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
