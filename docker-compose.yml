# AumOS Docker Compose — full local development environment.
#
# Brings up all deployable AumOS services with mock backends for local development
# and testing. Each service runs in its own container with health checks.
#
# Usage:
#   docker-compose up              # Start all services
#   docker-compose up trust-core   # Start just trust-core
#   docker-compose down            # Stop everything
#
# Services are accessible at localhost:<port>. See comments for each service.

version: "3.9"

services:
  # ─── Trusted Core (Rust) ───────────────────────────────────────────────────
  # The cryptographic signing/verification service. Library-only in v1.0;
  # this container provides the CLI binary for `trust-core sign/verify`.
  trust-core:
    build:
      context: ./rust
      dockerfile: Dockerfile.trust-core
    ports:
      - "8440:8440"
    healthcheck:
      test: ["CMD", "trust-core", "key-gen"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      RUST_LOG: info

  # ─── Agent Identity (Go) ──────────────────────────────────────────────────
  # The identity and authority service. Issues SVIDs, capability tokens,
  # manages revocation. HTTP/JSON gateway at /v1/agent-identity:*.
  agent-identity:
    build:
      context: ./go/agent-identity
      dockerfile: Dockerfile
    ports:
      - "8441:8441"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8441/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      AUMOS_TRUST_DOMAIN: muveraai.com
      AUMOS_LOG_LEVEL: info

  # ─── Open Serve Kit (Go) ──────────────────────────────────────────────────
  # The OpenAI-compatible inference proxy. Routes to Mock backend by default.
  # Set BACKEND=vllm and BACKEND_URL to connect to a real model server.
  open-serve-kit:
    build:
      context: ./go/open-serve-kit
      dockerfile: Dockerfile
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8443/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      BACKEND: mock
    depends_on:
      agent-identity:
        condition: service_healthy

  # ─── Ollama (Local LLM) ───────────────────────────────────────────────────
  # Local LLM server for development. Provides OpenAI-compatible API
  # at http://localhost:11434/v1/. Used by open-serve-kit and bridge-rt.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ─── Inference Proxy (Rust) ───────────────────────────────────────────────
  # The gateway in front of open-serve-kit. Auth, rate-limit, prompt-filter, cache.
  inference-proxy:
    build:
      context: ./rust
      dockerfile: Dockerfile.inference-proxy
    ports:
      - "8444:8444"
    depends_on:
      open-serve-kit:
        condition: service_healthy

  # ─── Flight Recorder (Rust) ───────────────────────────────────────────────
  # Evidence plane. Emits signed AARs. Library-only in v1.0.
  flight-recorder:
    build:
      context: ./rust
      dockerfile: Dockerfile.flight-recorder
    ports:
      - "8445:8445"
    environment:
      RUST_LOG: info

  # ─── Kill Switch (Rust) ───────────────────────────────────────────────────
  # Emergency containment. <5s end-to-end. Library + CLI.
  kill-switch:
    build:
      context: ./rust
      dockerfile: Dockerfile.kill-switch
    ports:
      - "8446:8446"
    environment:
      RUST_LOG: info
      KILL_BUDGET_SECONDS: "5"

  # ─── Credential Vault (Rust) ──────────────────────────────────────────────
  # Agent-scoped credential brokering with secret scanning.
  credential-vault:
    build:
      context: ./rust
      dockerfile: Dockerfile.credential-vault
    ports:
      - "8447:8447"
    environment:
      RUST_LOG: info

  # ─── Tee Serve (Go) ───────────────────────────────────────────────────────
  # TEE-backed model serving sidecar (mock TEE in dev mode).
  tee-serve:
    build:
      context: ./go/tee-serve
      dockerfile: Dockerfile
    ports:
      - "8448:8448"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8448/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Tenant Guard (Go) ────────────────────────────────────────────────────
  # Multi-tenant GPU scheduling (MIG/MPS). Operator logic in v1.0.
  tenant-guard:
    build:
      context: ./go/tenant-guard
      dockerfile: Dockerfile
    ports:
      - "8449:8449"

  # ─── Fleet Marshal (Go) ───────────────────────────────────────────────────
  # OTA model fleet management with canary/blue-green rollout.
  fleet-marshal:
    build:
      context: ./go/fleet-marshal
      dockerfile: Dockerfile
    ports:
      - "8450:8450"

  # ─── Edge Sentinel (Go) ───────────────────────────────────────────────────
  # Edge inference attestation agent (<5MB).
  edge-sentinel:
    build:
      context: ./go/edge-sentinel
      dockerfile: Dockerfile
    ports:
      - "8451:8451"

  # ─── Lightwell Bridge (Go) ────────────────────────────────────────────────
  # AI-artifact patch distribution.
  lightwell-bridge:
    build:
      context: ./go/lightwell-bridge
      dockerfile: Dockerfile
    ports:
      - "8452:8452"

  # ─── DefStack Cloud (Go) ──────────────────────────────────────────────────
  # Managed SaaS control plane for tenant management.
  defstack-cloud:
    build:
      context: ./go/defstack-cloud
      dockerfile: Dockerfile
    ports:
      - "8453:8453"

  # ─── Sovereign Stack (Go) ─────────────────────────────────────────────────
  # Air-gapped deployment bundle manager.
  sovereign-stack:
    build:
      context: ./go/sovereign-stack
      dockerfile: Dockerfile
    ports:
      - "8454:8454"

  # ─── MCP Server (TypeScript) ──────────────────────────────────────────────
  # Exposes 15 AumOS tools to any MCP-compatible coding agent via stdio.
  # Not a network service — run interactively: docker compose run --rm aumos-mcp
  #
  # Runs CONNECTED, against the real services defined above. It used to default
  # to `standalone`, which answers with responses tagged `source: "mock"` — so
  # the first thing anyone saw after `docker compose up` was a demo, while the
  # services it should have been talking to sat healthy in this same file.
  #
  # For a deliberate zero-dependency dry run, override it explicitly:
  #   docker compose run --rm -e AUMOS_MODE=standalone aumos-mcp
  # The mock is worth keeping; it just should not be what you get by accident.
  #
  # The build context is the repo root because the image carries `trust-core`
  # and `defstack` — connected mode shells out to them, and a Node-only image
  # could not run those tools at all. See typescript/mcp-server/Dockerfile.
  aumos-mcp:
    build:
      context: .
      dockerfile: typescript/mcp-server/Dockerfile
    stdin_open: true
    environment:
      AUMOS_MODE: connected
      # Only agent-identity is wired, and the omissions are deliberate.
      #
      # agent-identity is a real HTTP server (Go, with /healthz). The compose
      # DNS name is used rather than localhost, because inside the network
      # `localhost` is this container — a localhost URL would fail in a way that
      # reads as the service being down.
      AUMOS_AGENT_IDENTITY_URL: http://agent-identity:8441
      #
      # flight-recorder, kill-switch and credential-vault are NOT wired, because
      # their compose containers are not those services:
      #
      #   flight-recorder  — its container runs a hand-written TCP stub that
      #                      answers EVERY path with
      #                      {"service":"flight-recorder","status":"ok",
      #                       "mode":"library-only (E1)"}.
      #                      Pointing the emit/verify tools at it would return
      #                      HTTP 200 and be reported as `source:
      #                      "flight-recorder"` over a body that is not a
      #                      receipt — a success-shaped mock claiming a real
      #                      source, which is worse than the labelled one and is
      #                      exactly the AUD-001 failure.
      #   kill-switch      — ENTRYPOINT ["kill-switch"] CMD ["status"]: a
      #   credential-vault — one-shot CLI that exits. Nothing ever listens.
      #
      # Left unset they fall back to the localhost default, which refuses the
      # connection and surfaces a named dependency failure. An honest error
      # beats a convincing lie, so these stay unset until the services exist.
      AUMOS_TRUST_CORE_BIN: /usr/local/bin/trust-core
      AUMOS_DEFSTACK_BIN: /usr/local/bin/defstack
    depends_on:
      # Only on what genuinely reports health. `condition: service_healthy`
      # against a container with no HEALTHCHECK is a hard error at `up` time,
      # and kill-switch and credential-vault have none — correctly, since they
      # exit rather than serve.
      agent-identity:
        condition: service_healthy

  # ─── AumOS Console (TypeScript) ───────────────────────────────────────────
  # The web dashboard for evidence, approvals, fleet, compliance, policies.
  # Development server on port 3000.
  console:
    build:
      context: ./typescript/console
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8441
    depends_on:
      agent-identity:
        condition: service_healthy

volumes:
  ollama-models:
    driver: local
